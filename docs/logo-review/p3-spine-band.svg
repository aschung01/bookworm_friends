<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#09BC8A"/>
  <!--
    One book, spine band, no ribbon — the detail s3i and o8 both showed survives,
    applied to a single portrait book.

    The band is 56 wide and runs the full height, so the mark splits into an
    84-wide spine and a cover. That is a book by construction rather than by
    added ornament, which is why it needs no second feature.
  -->
  <rect x="224" y="140" width="576" height="744" rx="48" fill="#ffffff"/>
  <rect x="308" y="140" width="56" height="744" fill="#09BC8A"/>
</svg>
