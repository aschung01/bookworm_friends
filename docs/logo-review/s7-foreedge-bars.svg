<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#09BC8A"/>
  <!--
    Vector translation of the one idea worth keeping from the AI moodboard
    (docs/logo-review/ai-moodboard/g4-negative-space.png).

    Horizontal bars read as a hamburger menu (see s1). The fix is to shape the
    right end of each bar as a page fore-edge: an arc with radius 70 across a
    108-tall bar, so it bulges ~25px past the body instead of ending in a plain
    rounded cap. Pure silhouette, no thin interior detail to lose at 48px.
    Five layers rather than three, for more "stack".
  -->
