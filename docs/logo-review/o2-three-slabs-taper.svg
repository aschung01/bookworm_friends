<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#09BC8A"/>
  <!--
    Removes the bookmark and asks the width to do its job instead.

    Widths taper 560 / 616 / 672 top-to-bottom, which is the stack read a
    viewer gets from a pile seen slightly from above. It costs zero extra
    shapes, where a bookmark costs one — so this is strictly simpler than N1
    while keeping three books.

    Every slab stays centred on x=512, so the taper reads as perspective
    rather than as a left-aligned ragged edge.
  -->
  <rect x="232" y="208" width="560" height="144" rx="30" fill="#ffffff"/>
  <rect x="204" y="440" width="616" height="144" rx="30" fill="#ffffff"/>
  <rect x="176" y="672" width="672" height="144" rx="30" fill="#ffffff"/>
</svg>
