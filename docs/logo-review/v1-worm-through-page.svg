<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#09BC8A"/>
  <!-- page -->
  <rect x="232" y="252" width="560" height="560" rx="52" fill="#ffffff"/>
  <!-- faint text, so the page reads as a page -->
  <g fill="#09BC8A" opacity="0.25">
    <rect x="296" y="330" width="200" height="24" rx="12"/>
    <rect x="296" y="386" width="140" height="24" rx="12"/>
  </g>
  <!-- burrow hole -->
  <ellipse cx="368" cy="668" rx="42" ry="23" fill="#09BC8A"/>
  <!-- segmented body: overlapping circles read as a caterpillar, not a smear -->
  <g fill="#09BC8A">
    <circle cx="394" cy="654" r="34"/>
    <circle cx="452" cy="606" r="48"/>
    <circle cx="516" cy="556" r="52"/>
    <circle cx="578" cy="498" r="56"/>
    <circle cx="640" cy="432" r="62"/>
  </g>
  <!-- eye -->
  <circle cx="662" cy="410" r="19" fill="#ffffff"/>
</svg>
