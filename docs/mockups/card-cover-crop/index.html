            /* ====================================================================
               Option 8: two boards, overlapping only when the count demands it.

               The hybrid of 4 and 5, and the one thing neither does alone: it spends
               the well's unused height *first*, and only starts hiding covers once both
               boards are full of covers at the app's own legibility floor.

               Three regimes, in order of preference, and the rule is the same each
               time -- take the cheapest layout whose covers still clear MIN_FACE_U:

                 A  one board, gaps, nothing hidden          n <= 5
                 B  two boards, gaps, nothing hidden         n <= 10
                 C  two boards, overlapping                  n >= 11

               In A and B a cover is as large as the width allows; in C it holds at
               OVERLAP_W_U and the *step* absorbs the count, which is what makes the
               layout scale without the covers dwindling. A reader who finishes their
               eleventh book does not watch the other ten shrink.
               ==================================================================== */
            function boardPlan(n, reserveU) {
                reserveU = reserveU || 0;
                /* A. One board. Never reserved: a one-board shelf stands at the bottom of
                   the well, below the seal, so holding the corner there would spend
                   capacity protecting something nothing was covering. */
                let w1 = (CARD_UNITS - GAP_U * (n - 1)) / n;
                if (w1 / ASPECT > CAP1_U) w1 = CAP1_U * ASPECT;
                if (n === 1 || w1 >= MIN_FACE_U) {
                    return {
                        mode: "A",
                        boards: 1,
                        per: n,
                        wU: w1,
                        hU: w1 / ASPECT,
                        stepU: null,
                        drawn: n,
                        rest: 0,
                    };
                }

                /* B. Two boards. Both are sized off the fuller row, so a short bottom
                   board carries books the same size as the top one and is centred
                   rather than stretched. */
                const per = Math.ceil(n / 2);
                let w2 = (CARD_UNITS - reserveU - GAP_U * (per - 1)) / per;
                if (w2 / ASPECT > CAP2_U) w2 = CAP2_U * ASPECT;
                if (w2 >= MIN_FACE_U) {
                    return {
                        mode: "B",
                        boards: 2,
                        per,
                        wU: w2,
                        hU: w2 / ASPECT,
                        stepU: null,
                        drawn: n,
                        rest: 0,
                    };
                }

                /* C. Two boards, overlapping.

                   The plate has to be paid for out of the same 106 units, and only
                   once there is something to put on it -- so capacity is computed
                   twice: once assuming every book fits, and again with the plate's
                   width reserved if it turns out they do not. The cost is a visible
                   step down in the drawn count as the ceiling is crossed (the plate
                   is about two covers' worth of sliver), which is ugly but honest. */
                const perMax = perAtStep(MIN_STEP_U);
                const overflows = n > 2 * perMax;
                const availU = overflows
                    ? CARD_UNITS - PLATE_U - GAP_U
                    : CARD_UNITS;
                const perFit = overflows
                    ? 1 + Math.floor((availU - OVERLAP_W_U) / MIN_STEP_U)
                    : perMax;
                const p = Math.min(Math.ceil(n / 2), perFit);
                const stepU = p > 1 ? (availU - OVERLAP_W_U) / (p - 1) : 0;
                const drawn = Math.min(n, 2 * p);
                return {
                    mode: "C",
                    boards: 2,
                    per: p,
                    wU: OVERLAP_W_U,
                    hU: CAP2_U,
                    stepU,
                    drawn,
                    rest: n - drawn,
                    /* True once the step is at its floor and books are being dropped --
                       the point past which no geometry helps and the plate is the only
                       honest answer. */
                    atCeiling: p === perFit && n > 2 * perFit,
                };
            }

            function layoutBoards(books, o) {
                const plan = boardPlan(books.length);
                const lean = (o && o.lean) || "left";
                const shown = books.slice(0, plan.drawn);
                const topN =
                    plan.boards === 1 ? plan.drawn : Math.ceil(plan.drawn / 2);
                const halves = [shown.slice(0, topN), shown.slice(topN)];

                const mkRow = (list) => {
                    if (plan.stepU === null) {
                        return {
                            items: list.map((b) => {
                                const s =
                                    1 - ((bookHash(b.isbn) % 5) / 5) * 0.1;
                                return {
                                    b,
                                    wU: plan.wU * s,
                                    hU: plan.hU * s,
                                    kind: "face",
                                };
                            }),
                        };
                    }
                    return {
                        items: leanItems(
                            list,
                            plan.wU,
                            plan.hU,
                            plan.stepU,
                            lean,
                        ),
                        stack: true,
                        heightU: plan.hU,
                    };
                };

                const rows = [mkRow(halves[0])];
                if (halves[1].length) rows.push(mkRow(halves[1]));
                return {
                    rows,
                    plan,
                    plate:
                        plan.rest > 0
                            ? {
                                  wU: PLATE_U,
                                  hU: plan.hU * 0.42,
                                  rest: plan.rest,
                              }
                            : null,
                    baseWU: plan.wU,
                    stepU: plan.stepU,
                    shown:
                        plan.stepU === null
                            ? undefined
                            : Math.min(1, plan.stepU / plan.wU),
                };
            }

            /* ====================================================================
               Option 9: the phase-out.

               A hybrid of 8 and 6, and the thing neither of them has: the front of the
               shelf is **what the reader has open right now**, and everything behind it
               is given up gradually rather than at a typed boundary.

               `hybrid` faces out a fixed three and spines the rest, so the cut never
               moves. `boards` keeps every book a face and pays for the count in
               occlusion, so past 60 there is nothing left to give. This does neither.
               It gives up *representation* in order, in three steps, and each step is
               a renderer this app already ships:

                 face   -> the jacket, whole              (BookWidget)
                 spine  -> toned, title running up it     (BookVertical + spineTintFor)
                 sliver -> toned, separated, untitled     (the read pile's dense state)

               Two things fall out of that and both are the point:

                 * **The face count shrinks as the library grows, and the books the
                   reader is holding are the last thing given up.** F floats from
                   PHASE_FACE_MAX down to however many books are open, and only then do
                   the spines start to thin.
                 * **It reaches much further than `boards`.** A sliver of spine has no
                   artwork to throw away, so its floor is MIN_SLIVER_U rather than
                   MIN_STEP_U, and capacity roughly doubles.

               Nothing overlaps. Spines are pressed together, which is what books on a
               shelf actually do, so the fore-edge/spine-side question the `lean` toggle
               exists to answer does not arise here.
               ==================================================================== */
            function phasePlan(nReading, nFinished) {
                const n = nReading + nFinished;
                const faceW = OVERLAP_W_U;

                /* Never fewer faces than there are open books -- that is the promise the
                   option makes -- but one at minimum, so a reader with nothing open still
                   gets a face at the front. */
                const minFaces = Math.max(
                    1,
                    Math.min(nReading, PHASE_FACE_MAX),
                );

                /* A. Everything fits as a face. Then this *is* `boards`, and it says so
                      rather than reimplementing the two gapped regimes. */
                const bp = boardPlan(n);
                if (bp.stepU === null) {
                    return {
                        mode: "A",
                        boards: bp.boards,
                        faces: n,
                        spineW: null,
                        top: bp.per,
                        faceW: bp.wU,
                        faceH: bp.hU,
                        drawn: n,
                        rest: 0,
                        counts: { face: n, spine: 0, sliver: 0 },
                    };
                }

                /* How many spines a board holds beside F faces, and on its own. Faces
                   carry a gap each -- between them, and one more before the first spine.
                   Spines are pressed together and carry none. */
                const capTop = (F, sw) =>
                    Math.max(
                        0,
                        Math.floor(
                            (CARD_UNITS - F * faceW - F * GAP_U) / sw + 1e-9,
                        ),
                    );
                const capBot = (sw, plate) =>
                    Math.max(
                        0,
                        Math.floor(
                            (CARD_UNITS - (plate ? PLATE_U + GAP_U : 0)) / sw +
                                1e-9,
                        ),
                    );

                /* B. Spines at their natural width, and as many faces as will still
                      leave room for every remaining book. F falls one at a time, so the
                      front group is as large as the library allows. */
                for (let F = PHASE_FACE_MAX; F >= minFaces; F--) {
                    if (F * faceW + F * GAP_U > CARD_UNITS) continue;
                    if (
                        F + capTop(F, SPINE_W_U) + capBot(SPINE_W_U, false) >=
                        n
                    ) {
                        return build(F, SPINE_W_U, "B");
                    }
                }

                /* C. The front group is down to the open books, so the spines thin.

                   Solved, then walked. The closed form -- both boards' remaining width
                   over the number of books that need shelving -- is *not* enough on its
                   own: each board floors its own slot count independently, so a spine
                   width that fits 58 books' worth of total width can still yield 22 + 35
                   slots and drop one. The walk gives that fraction of a slot back. */
                const F = minFaces;
                const spineRoom = 2 * CARD_UNITS - F * faceW - F * GAP_U;
                const need = n - F;
                let sw = Math.min(SPINE_W_U, spineRoom / need);
                for (
                    let i = 0;
                    i < 96 &&
                    sw > MIN_SLIVER_U &&
                    capTop(F, sw) + capBot(sw, false) < need;
                    i++
                ) {
                    sw = Math.max(MIN_SLIVER_U, sw * 0.98);
                }
                if (capTop(F, sw) + capBot(sw, false) >= need) {
                    return build(F, sw, "C");
                }

                /* D. At the sliver floor, with a plate for whatever is left over. */
                return build(F, MIN_SLIVER_U, "D", true);

                function build(F, sw, mode, plate) {
                    const top = capTop(F, sw);
                    const bot = capBot(sw, plate);
                    const spines = Math.min(n - F, top + bot);
                    const drawn = F + spines;
                    const counts = { face: F, spine: 0, sliver: 0 };
                    /* The renderer is chosen by the width, so the split between titled
                       spines and slivers is a consequence of `sw`, not a third decision. */
                    if (sw >= MIN_TITLED_SPINE_U) counts.spine = spines;
                    else counts.sliver = spines;
                    return {
                        mode,
                        boards: spines > top ? 2 : 1,
                        faces: F,
                        spineW: sw,
                        top: F + Math.min(spines, top),
                        faceW,
                        faceH: CAP2_U,
                        drawn,
                        rest: n - drawn,
                        atCeiling: mode === "D",
                        counts,
                    };
                }
            }

            function layoutPhase(books, o, total) {
                const nReading = books.filter((b) => b.reading).length;
                const plan = phasePlan(nReading, books.length - nReading);
                const shown = books.slice(0, plan.drawn);

                const mk = (b, i) => {
                    if (i < plan.faces) {
                        /* The front group. One scale for both dimensions, so the aspect
                           cannot drift -- the fault this whole page is about. */
                        const s =
                            plan.mode === "A"
                                ? 1 - ((bookHash(b.isbn) % 5) / 5) * 0.1
                                : 1;
                        return {
                            b,
                            wU: plan.faceW * s,
                            hU: plan.faceH * s,
                            kind: "face",
                            gap: true,
                        };
                    }
                    return {
                        b,
                        wU: plan.spineW,
                        hU:
                            plan.faceH *
                            (1 - ((bookHash(b.isbn) % 4) / 4) * 0.06),
                        kind:
                            plan.spineW >= MIN_TITLED_SPINE_U
                                ? "spine"
                                : "sliver",
                    };
                };

                const items = shown.map(mk);
                const rows = [
                    { items: items.slice(0, plan.top), pressed: true },
                ];
                if (items.length > plan.top) {
                    rows.push({ items: items.slice(plan.top), pressed: true });
                }
                return {
                    rows,
                    phase: plan,
                    plate:
                        plan.rest > 0
                            ? {
                                  wU: PLATE_U,
                                  hU: plan.faceH * 0.42,
                                  rest: plan.rest,
                              }
                            : null,
                    plateRow: rows.length - 1,
                };
            }

            /* ====================================================================
               THE SHELF, as decided.

               Two boards, three fixed sizes, and **nothing is ever squeezed**. What
               `boards` and `phase` differ in turns out to be one choice and not two
               designs -- are read books drawn as covers or as spines -- so it stops
               being ours to make and becomes a setting. Everything those two options did
               to absorb a large library (shrinking the step to 3 units, thinning spines
               to 6.3pt) is gone: past capacity the shelf says how many it is not
               showing.

               Sizes, all fixed, none invented:

                 SHELF_FACE_U   the widest cover a two-board card can carry
                 SHELF_SPINE_U  BookVertical's own proportion at that height
                 SHELF_STEP_U   equal to the spine width, because a leaning cover shows
                                exactly a spine's worth of itself -- which is what a
                                shelf of leaning books actually looks like, and it means
                                the two cover layouts and the spine layout are all
                                measured in the same unit
               ==================================================================== */
            const SHELF_FACE_U = CAP2_U * ASPECT;
            const SHELF_SPINE_U = SPINE_W_U;
            const SHELF_STEP_U = SPINE_W_U;

            /* The seal's disc, and the room the **top board** holds clear for it.

               The seal is 15 units across on the card, whose board is 98 of *those* units
               while this page's board is `CARD_UNITS` of its own -- the 7.5% deviation this
               file documents at CAP1_U. Converted rather than retyped, so a change to the
               seal moves this and not a hardcoded 16.2.

               Why at all: the seal is a blind emboss the candle reveals, and the top board
               was standing in front of it -- the 18th overlapping book left 38% of the disc
               showing, a full row of spines 15%. See `docs/mockups/card-seal/`, option
               `reserve`, which is what shipped. The cost is in the capacity table below:
               three books overlapping and four as spines. */
            const SHELF_SEAL_U = 15 * (CARD_UNITS / 98);
            const SHELF_RESERVE_U = SHELF_SEAL_U + GAP_U;

            /* The three layouts this page costed, of which **two ship**. `overlap` only
               means anything once a board is full: below that it is identical to `single`,
               because overlapping is permission to lean, not an instruction to.

               `single` was withdrawn. It is kept here because it is the evidence: the
               capacity table below is what says it holds 10 where overlapping holds 34, and
               a setting whose second option hides two thirds of a real library is a
               question the product should answer itself. `CardCoverDisplay` in
               `card_shelf_plan.dart` now has two values, and the panel has one group. */
            const SHELF_MODES = [
                ["single", "Covers, side by side (withdrawn)"],
                ["overlap", "Covers, overlapping"],
                ["spine", "Spines"],
            ];

            /* How many items of width `w` advancing by `step` fit in `room`. One formula
               for all three modes: item i occupies [i*step, i*step + w]. */
            function fitCount(room, w, step) {
                return room < w ? 0 : 1 + Math.floor((room - w) / step + 1e-9);
            }

            /* The shelf, solved twice when it needs two boards.

               The reservation is the *top* board's to pay, because the seal is in the well's
               top-right corner -- but only once it is known that a top board exists, and
               that is not known until the shelf has been solved. So the bare shelf is solved
               first and the answer is thrown away if it wants two boards. Ported to
               `cardShelfPlan`, which does the same thing for the same reason. */
            function shelfPlan(nReading, nRead, mode) {
                const bare = shelfPass(nReading, nRead, mode, 0);
                if (bare.boards <= 1) return bare;
                return shelfPass(nReading, nRead, mode, SHELF_RESERVE_U);
            }

            function shelfPass(nReading, nRead, mode, reserveU) {
                /* The front group is capped by what it must leave behind: **the top board
                   has to be able to draw at least one finished book**, after the seal's
                   corner has been held.

                   The books the hero counts have first claim on the shelf; an open book is
                   context for them. Sizing the front group against the whole board gives
                   five, and five open covers spend 92 of CARD_UNITS' 106 -- less than one
                   SHELF_FACE_U left, and nothing at all once SHELF_RESERVE_U is held -- so a
                   reader with 22 finished books and six on the go saw none of the 22 on the
                   top board, and none at all in the one-board hero tile, under a figure
                   reading 22. That was a real reported bug, not a hypothetical.

                   Half a board was the first fix and gave two. It held, but half is a
                   fraction with no argument behind it, and it missed the third open book by
                   0.64 of a unit: three covers in a row want 53.64 and half of CARD_UNITS is
                   53. So the cap is stated as the guarantee instead -- whatever is left of
                   the top board once SHELF_RESERVE_U and one whole SHELF_FACE_U are set
                   aside -- which gives three and says why. One whole cover, because that is
                   the widest a finished book is ever drawn: spines get the guarantee several
                   times over, which is the right direction to be wrong in.

                   Not through `fitCount`: that charges n-1 gaps because it measures books
                   standing in a row, and the last open book still needs a gap between it and
                   the first finished one, so the front group charges n. A plain division is
                   the right shape here. It comes out at 3.875, nowhere near an integer, so
                   this one carries no epsilon, unlike `fitCount`'s 1e-9: there is no
                   tolerance for a later change to hide inside.

                   SHELF_RESERVE_U rather than this pass's `reserveU`: the cap is one number
                   for every shelf, the way `kCardReadingMax` is a constant, so the one-board
                   pass that never pays the reserve still caps its front group at three.

                   Ported to `kCardReadingMax` in `card_shelf_plan.dart`. The old bug's
                   escape hatch went with it: the capacity table below now quotes three open
                   books alongside nought, one and two, so a cap that starves the top board
                   shows up as a column instead of hiding past the last one printed. */
                const r = Math.min(
                    nReading,
                    Math.floor(
                        (CARD_UNITS - SHELF_RESERVE_U - SHELF_FACE_U) /
                            (SHELF_FACE_U + GAP_U),
                    ),
                );
                const n = r + nRead;

                /* A. Every book on the shelf is a cover and they all fit side by side, so
                      they grow -- exactly `boards`' first two regimes. Refusing to squeeze
                      does not mean refusing to fill: a two-book card should still be two
                      large covers. */
                if (mode !== "spine" || nRead === 0) {
                    const bp = boardPlan(n, reserveU);
                    if (bp.stepU === null) {
                        return {
                            mode,
                            grown: true,
                            boards: bp.boards,
                            faceW: bp.wU,
                            faceH: bp.hU,
                            readW: bp.wU,
                            readStep: bp.wU + GAP_U,
                            readKind: "face",
                            reading: r,
                            top: bp.per,
                            drawn: n,
                            rest: 0,
                        };
                    }
                }

                /* B. Fixed sizes, two boards, a plate for the remainder. */
                const readW = mode === "spine" ? SHELF_SPINE_U : SHELF_FACE_U;
                const readStep =
                    mode === "spine"
                        ? SHELF_SPINE_U
                        : mode === "overlap"
                          ? SHELF_STEP_U
                          : SHELF_FACE_U + GAP_U;

                /* The front group: the open books, always whole covers, each carrying its
                   own gap so the read books start clear of them. */
                const frontU = r * (SHELF_FACE_U + GAP_U);
                const topRoom = CARD_UNITS - frontU - reserveU;

                const top = fitCount(topRoom, readW, readStep);
                let bot = 0;
                let plate = false;
                if (top < nRead) {
                    bot = fitCount(CARD_UNITS, readW, readStep);
                    if (top + bot < nRead) {
                        plate = true;
                        bot = fitCount(
                            CARD_UNITS - PLATE_U - GAP_U,
                            readW,
                            readStep,
                        );
                    }
                }
                const drawnRead = Math.min(nRead, top + bot);
                return {
                    mode,
                    grown: false,
                    boards: drawnRead > top ? 2 : 1,
                    faceW: SHELF_FACE_U,
                    faceH: CAP2_U,
                    readW,
                    readStep,
                    readKind:
                        mode === "spine"
                            ? "spine"
                            : mode === "overlap"
                              ? "lean"
                              : "face",
                    reading: r,
                    top: r + Math.min(drawnRead, top),
                    drawn: r + drawnRead,
                    rest: nRead - drawnRead,
                    plate,
                };
            }

            /* Capacity per mode, asked rather than solved -- a closed form here would be
               a second copy of shelfPlan's arithmetic and would eventually disagree with
               the drawings. */
            function shelfCapacity(mode, nReading) {
                let n = nReading;
                while (
                    n < 500 &&
                    shelfPlan(nReading, n - nReading, mode).rest === 0
                ) {
                    n++;
                }
                return n - 1;
            }
            /* Nought through three open books, three because that is the front group's
               cap: the row for the cap has to exist or the worst the open books can do to
               capacity is never quoted, which is exactly how a front group of five covers
               shipped. Indices are read directly in the prose below, so this array is the
               table and the table is this array. */
            const SHELF_MAX = {};
            SHELF_MODES.forEach(([m]) => {
                SHELF_MAX[m] = [0, 1, 2, 3].map((r) => shelfCapacity(m, r));
            });

            function layoutShelf(books, o) {
                const reading = books.filter((b) => b.reading);
                const read = books.filter((b) => !b.reading);
                const mode = (o && o.readAs) || "overlap";
                const plan = shelfPlan(reading.length, read.length, mode);

                const front = reading.slice(0, plan.reading).map((b) => ({
                    b,
                    wU: plan.faceW,
                    hU: plan.faceH,
                    kind: "face",
                    gap: true,
                }));
                const rest = read
                    .slice(0, plan.drawn - plan.reading)
                    .map((b) => {
                        /* Height jitter only, from one hash, so the aspect cannot drift. */
                        const j = 1 - ((bookHash(b.isbn) % 4) / 4) * 0.06;
                        if (plan.readKind === "spine") {
                            return {
                                b,
                                wU: plan.readW,
                                hU: plan.faceH * j,
                                kind: "spine",
                            };
                        }
                        /* A cover varies only into the headroom it has above the title
                           floor, so the jitter can never do the one thing it exists to
                           avoid. `SHELF_FACE_U` sits 0.2 units over `MIN_FACE_U`, so a
                           cover already at that width has nowhere to shrink to: 10% off
                           it lands at 13.9 units, under the width at which a cover stops
                           carrying its own title. Only the one-board grown sizes have
                           room, and they keep the full range. Ported to
                           `card_cover_row.dart`'s `_sizeUnits`. */
                        const s =
                            plan.grown && plan.readW > SHELF_FACE_U
                                ? 1 - ((bookHash(b.isbn) % 5) / 5) * 0.1
                                : 1;
                        return {
                            b,
                            wU: plan.readW * s,
                            hU: plan.faceH * s,
                            kind: "face",
                            gap: plan.readKind === "face",
                        };
                    });

                const items = front.concat(rest);
                const rows = [];
                const mkRow = (list, offset) => {
                    if (plan.readKind !== "lean") {
                        return { items: list, pressed: true };
                    }
                    /* Leaning covers. Newest leftmost and whole, z falling to the right --
                       the front group leans too, so the shelf reads as one gesture. */
                    let x = 0;
                    const placed = list.map((it, i) => {
                        const at = x;
                        x += it.gap ? it.wU + GAP_U : plan.readStep;
                        return Object.assign({}, it, {
                            xU: at,
                            z: list.length - i,
                        });
                    });
                    return { items: placed, stack: true, heightU: plan.faceH };
                };

                rows.push(mkRow(items.slice(0, plan.top), 0));
                if (items.length > plan.top) {
                    rows.push(mkRow(items.slice(plan.top), plan.top));
                }
                return {
                    rows,
                    shelf: plan,
                    plate:
                        plan.rest > 0
                            ? {
                                  wU: PLATE_U,
                                  hU: plan.faceH * 0.42,
                                  rest: plan.rest,
                              }
                            : null,
                    plateRow: rows.length - 1,
                };
            }

            /* Option 6: draw the spine the geometry already describes. */
            function layoutSpines(books, o) {
                const lay = layoutToday(books, o);
                lay.rows[0].items.forEach((i) => (i.kind = "spine"));
                return lay;
            }

            /* Option 7: face out the newest, spine the rest.

                A bookshop shelf, and the only option that answers both questions at
                once -- what did they just read, and how much do they read. The spine
                width is solved for rather than fixed: spines shrink until they hit a
                legibility floor, and anything that still does not fit goes to the
                plate. */
            const FACES = 3;
            const MIN_SPINE_U = 3.4;
            function layoutHybrid(books, o, total) {
                const F = Math.min(FACES, books.length);
                const faceH = Math.min(19, H_BUDGET_U);
                const faceW = faceH * ASPECT;
                const faceTotal = F * faceW;
                const pool = books.slice(F);

                let k = pool.length,
                    spineW = MIN_SPINE_U,
                    avail = 0;
                for (; k > 0; k--) {
                    const undrawn = total - F - k;
                    const plateU = undrawn > 0 ? PLATE_U + GAP_U : 0;
                    const gaps = GAP_U * (F + k - 1);
                    avail = CARD_UNITS - faceTotal - gaps - plateU;
                    if (avail / k >= MIN_SPINE_U) {
                        spineW = Math.min(6.4, avail / k);
                        break;
                    }
                }
                const faces = books.slice(0, F).map((b) => ({
                    b,
                    wU: faceW,
                    hU: faceH,
                    kind: "face",
                }));
                const spines = pool.slice(0, k).map((b) => ({
                    b,
                    wU: spineW,
                    hU: 15 + (Math.floor(bookHash(b.isbn) / 3) % 4),
                    kind: "spine",
                }));
                const rest = total - F - spines.length;
                return {
                    rows: [{ items: faces.concat(spines) }],
                    plate:
                        rest > 0
                            ? { wU: PLATE_U, hU: faceH * 0.42, rest }
                            : null,
                };
            }

            /* ====================================================================
                SECTION 5: assembly
                ==================================================================== */

            function plateHtml(p) {
                const wPt = p.wU * ROW_U,
                    hPt = p.hU * ROW_U;
                return (
                    '<i class="plate" style="width:' +
                    r2(wPt) +
                    "px;height:" +
                    r2(hPt) +
                    "px;font-size:" +
                    r2(Math.min(wPt * 0.42, 11)) +
                    'px">+' +
                    p.rest +
                    "</i>"
                );
            }

            /* How far a cover's artwork spills outside its box, per side. Zero when the
                  box is cover-shaped, which is why the diagnostic view is empty for every
                  option except the first two. */
            function overhangOf(it, o) {
                if (it.kind !== "face") return { l: 0, r: 0 };
                const wPt = it.wU * ROW_U,
                    hPt = it.hU * ROW_U;
                const f = fitCover(
                    wPt,
                    hPt,
                    o.ax === undefined ? 0.5 : o.ax,
                    o.ay === undefined ? 0.5 : o.ay,
                );
                return {
                    l: Math.max(0, -f.l),
                    r: Math.max(0, f.sw - wPt + f.l),
                };
            }

            function rowHtml(r, ri, lay, o) {
                if (r.stack) {
                    const hPt =
                        Math.max.apply(
                            null,
                            r.items.map((i) => i.hU),
                        ) * ROW_U;
                    let wPt =
                        Math.max.apply(
                            null,
                            r.items.map((i) => i.xU + i.wU),
                        ) * ROW_U;
                    /* The plate sits past the end of the stack on the first board only,
                       and it is bottom-aligned like everything else standing here. */
                    let plate = "";
                    if (
                        ri ===
                            (lay.plateRow === undefined ? 0 : lay.plateRow) &&
                        lay.plate
                    ) {
                        const x = wPt + GAP_U * ROW_U;
                        plate =
                            '<span style="position:absolute;bottom:0;display:flex;left:' +
                            r2(x) +
                            'px;z-index:999">' +
                            plateHtml(lay.plate) +
                            "</span>";
                        wPt = x + lay.plate.wU * ROW_U;
                    }
                    return (
                        '<div class="row stack" style="height:' +
                        r2(hPt) +
                        "px;width:" +
                        r2(wPt) +
                        'px;margin:0 auto">' +
                        r.items.map((i) => itemHtml(i, o)).join("") +
                        plate +
                        "</div>"
                    );
                }
                const bits = r.items.map((i) => itemHtml(i, o));
                const plateOn = lay.plateRow === undefined ? 0 : lay.plateRow;
                if (ri === plateOn && lay.plate)
                    bits.push(plateHtml(lay.plate));
                return (
                    '<div class="row" style="gap:' +
                    r2(r.pressed ? 0 : GAP_U * ROW_U) +
                    'px">' +
                    bits.join("") +
                    "</div>"
                );
            }

            /* The crop, stated exactly.

                    The in-row ghosts show the aggregate, and at twelve covers they overlap
                    each other into a band -- which is itself true, but not legible. So the
                    diagnostic also draws the first few jackets at 3x: the whole jacket, with
                    the window the export actually keeps picked out on it. This is the one
                    figure on the page that makes the defect unarguable. */
            const ZOOM = 3;
            function cropCallout(lay, o) {
                if (!o.diag) return "";
                const faces = lay.rows[0].items
                    .filter((i) => i.kind === "face")
                    .slice(0, 3);
                const ax = o.ax === undefined ? 0.5 : o.ax;
                const ay = o.ay === undefined ? 0.5 : o.ay;
                const cells = faces
                    .map((it) => {
                        const wPt = it.wU * ROW_U * ZOOM,
                            hPt = it.hU * ROW_U * ZOOM;
                        const f = fitCover(wPt, hPt, ax, ay);
                        const keep = f.vis;
                        return (
                            '<div class="zcell"><div class="zc" style="width:' +
                            r2(f.sw) +
                            "px;height:" +
                            r2(f.sh) +
                            'px">' +
                            jacketSpan(it.b, f, 0, 0, "gh", it.wU * ROW_U) +
                            '<span class="zwin" style="left:' +
                            r2(-f.l) +
                            "px;top:" +
                            r2(-f.t) +
                            "px;width:" +
                            r2(wPt) +
                            "px;height:" +
                            r2(hPt) +
                            'px">' +
                            jacketSpan(it.b, f, f.l, f.t, "", it.wU * ROW_U) +
                            "</span></div>" +
                            '<div class="zcap">keeps <b>' +
                            pct(keep) +
                            "</b></div></div>"
                        );
                    })
                    .join("");
                return (
                    '<div class="zoom"><div class="zh">The jacket, at 3&times;. Bright is what the export keeps.</div>' +
                    '<div class="zrow">' +
                    cells +
                    "</div></div>"
                );
            }

            /* The record under the well. Drawn because the well's height is the budget
                every option is spending, and an option cannot be judged on a strip of
                covers with the rest of the card cropped away -- which is, with some
                irony, the mistake this whole page is about. */
            function cardBodyHtml(o, total) {
                return (
                    '<div class="cbody' +
                    (o.lit ? " cdl" : "") +
                    '" style="height:' +
                    r2(CARD_H - WELL_H) +
                    'px">' +
                    '<div class="ttl">MY LIBRARY CARD</div>' +
                    '<div class="sub">도서관 카드 &middot; LIBRARY &middot; CARD</div>' +
                    '<div class="rec"><div class="fig">' +
                    total +
                    "<s>books</s></div>" +
                    '<div class="rows"><i>Holder</i><b>독서하는 유니콘</b>' +
                    "<i>Authority</i><b>책벌레 친구들 &middot; LIBSTACK</b>" +
                    "<i>Date of issue</i><b>03 SEP 26</b>" +
                    "<i>Member since</i><b>06 MAY 26</b></div></div>" +
                    /* The stat row. Drawn because it is the other thing competing for
                       the card's height, so an option that wants more well has to be
                       seen against it rather than against empty stock. */
                    '<div class="stats"><div>Days reading<b>451</b></div>' +
                    "<div>Pace<b>21d</b></div>" +
                    "<div>Authors<b>20</b></div>" +
                    "<div>Shelves<b>8</b></div></div>" +
                    /* Escaped, and it matters: an unescaped run of `<` filler was the first
                    bug found on the sharing mockup -- the browser read `<<<<` as a tag
                    and swallowed the rest of the card, and the markup "worked". */
                    '<div class="mrz">ALLTIME&lt;&lt;ASCHUNG&lt;&lt;MEMBER06MAY26&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;<br />ISSUED03SEP26&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;@LIBSTACK.APP</div>' +
                    "</div>"
                );
            }

            /* The control, drawn as it would sit in the share preview: a button at the
               card's top right, and the panel it opens. Drawn open, because a mockup has
               to show the affordance rather than describe it.

               `Layout` is disabled under Spines, because a spine has no fore-edge to lean
               on -- shelved books touch. Disabling it rather than hiding it is the choice
               `share_card_page.dart` already makes for a destination that is not
               installed: a control that vanishes teaches nothing. */
            function displayMenu() {
                const spines = S.readAs === "spine";
                /* The two groups answer different questions, so their selected states are
                   computed differently: `Covers` is on for either cover layout, and picking
                   it returns to whichever layout was last used rather than resetting one. */
                const btn = (v, label, on) =>
                    '<button data-disp="readAs:' +
                    v +
                    '" class="' +
                    (on ? "on" : "") +
                    '">' +
                    label +
                    "</button>";
                /* Clamped to the capacity table's last row rather than to two, which is
                   where the table used to stop. This panel is **withdrawn** -- it is kept as
                   the evidence for the cost note below -- but a withdrawn drawing quoting a
                   capacity the shelf does not have is worse evidence than none. */
                const cap =
                    SHELF_MAX[S.readAs][
                        Math.min(SHELF_MAX[S.readAs].length - 1, S.reading)
                    ];
                return (
                    '<div class="dispbtn">&hellip;</div><div class="dispmenu">' +
                    '<div class="dh">Books you have read</div>' +
                    btn("@cover", "Covers", !spines) +
                    btn("spine", "Spines", spines) +
                    '<div class="dh">Layout</div>' +
                    (spines
                        ? '<button disabled class="on">Side by side</button>' +
                          "<button disabled>Overlapping</button>"
                        : btn("single", "Side by side", S.readAs === "single") +
                          btn(
                              "overlap",
                              "Overlapping",
                              S.readAs === "overlap",
                          )) +
                    '<div class="dcap">' +
                    (spines
                        ? "Shelved books touch, so there is nothing to overlap. Holds " +
                          cap +
                          "."
                        : "Holds " + cap + " books this way.") +
                    "</div></div>"
                );
            }

            function stageHtml(lay, o, total) {
                return (
                    '<div class="stage' +
                    (o.diag ? " diag" : "") +
                    '">' +
                    '<div class="well' +
                    (o.lit ? " cdl" : "") +
                    '" style="height:' +
                    r2(WELL_H) +
                    'px"><span class="seal">LS</span><div class="inner">' +
                    lay.rows
                        .map(
                            (r, i) =>
                                '<div class="shelf">' +
                                rowHtml(r, i, lay, o) +
                                '<div class="board"></div></div>',
                        )
                        .join("") +
                    "</div></div>" +
                    cardBodyHtml(o, total) +
                    "</div>"
                );
            }

            /* ---- metrics, all derived from the layout ---- */
            function metricsOf(lay, o, total) {
                const items = lay.rows.reduce((a, r) => a.concat(r.items), []);
                const faces = items.filter((i) => i.kind === "face");
                const spines = items.filter((i) => i.kind === "spine");

                let usedU = 0,
                    hUsed = 0;
                lay.rows.forEach((r, ri) => {
                    const plateHere =
                        ri ===
                            (lay.plateRow === undefined ? 0 : lay.plateRow) &&
                        lay.plate;
                    /* A pressed row's air comes from the faces at its front, one gap each,
                       rather than from a gap between every pair: the spines behind them
                       are shelved touching. */
                    const gaps = r.pressed
                        ? GAP_U * r.items.filter((i) => i.gap).length
                        : GAP_U * (r.items.length - 1);
                    const u = r.stack
                        ? Math.max.apply(
                              null,
                              r.items.map((i) => i.xU + i.wU),
                          ) + (plateHere ? lay.plate.wU + GAP_U : 0)
                        : r.items.reduce((a, c) => a + c.wU, 0) +
                          gaps +
                          (plateHere ? lay.plate.wU + GAP_U : 0);
                    usedU = Math.max(usedU, u);
                    hUsed +=
                        Math.max.apply(
                            null,
                            r.items.map((i) => i.hU),
                        ) +
                        BOARD_U +
                        BOARD_GAP_U +
                        (ri > 0 ? 6 / ROW_U : 0);
                });

                const ws = items.map((i) => i.wU * ROW_U);
                const hs = items.map((i) => i.hU * ROW_U);
                const asp = faces.map((i) => i.wU / i.hU);
                const vis = faces.map((i) => {
                    const a = i.wU / i.hU;
                    return a < ASPECT ? a / ASPECT : ASPECT / a;
                });

                const out = [];
                if (lay.shelf) {
                    const p = lay.shelf;
                    const kind =
                        p.readKind === "spine"
                            ? "spines"
                            : p.readKind === "lean"
                              ? "leaning covers"
                              : "covers";
                    out.push(
                        "<span>read books as <b>" +
                            kind +
                            "</b> at <b>" +
                            r1(p.readW * ROW_U) +
                            "</b>pt" +
                            (p.grown ? " (grown to fill)" : " (fixed)") +
                            "</span>",
                    );
                    if (p.reading) {
                        out.push(
                            "<span><b>" +
                                p.reading +
                                "</b> open, whole, at the front</span>",
                        );
                    }
                    out.push(
                        "<span><b>" +
                            p.boards +
                            "</b> board" +
                            (p.boards > 1 ? "s" : "") +
                            (p.rest
                                ? ', <span class="warn">' +
                                  p.rest +
                                  " not shown</span>"
                                : ', <span class="fine">nothing hidden</span>') +
                            "</span>",
                    );
                }
                if (lay.phase) {
                    const c = lay.phase.counts;
                    const parts = [];
                    if (c.face) parts.push("<b>" + c.face + "</b> face");
                    if (c.spine) parts.push("<b>" + c.spine + "</b> spine");
                    if (c.sliver) parts.push("<b>" + c.sliver + "</b> sliver");
                    out.push(
                        "<span>" +
                            parts.join(" · ") +
                            " · " +
                            lay.phase.boards +
                            " board" +
                            (lay.phase.boards > 1 ? "s" : "") +
                            " <code>" +
                            lay.phase.mode +
                            "</code></span>",
                    );
                    if (lay.phase.spineW) {
                        out.push(
                            "<span>spine <b>" +
                                r1(lay.phase.spineW * ROW_U) +
                                "</b>pt" +
                                (lay.phase.spineW >= MIN_TITLED_SPINE_U
                                    ? ', <span class="fine">titled</span>'
                                    : ", untitled") +
                                "</span>",
                        );
                    }
                }
                if (lay.plan) {
                    out.push(
                        "<span><b>" +
                            lay.plan.boards +
                            "</b> board" +
                            (lay.plan.boards > 1 ? "s" : "") +
                            ", <b>" +
                            lay.plan.per +
                            "</b> per board, " +
                            (lay.plan.stepU === null
                                ? '<span class="fine">nothing hidden</span>'
                                : "overlapping") +
                            " <code>" +
                            lay.plan.mode +
                            "</code></span>",
                    );
                }
                out.push(
                    "<span><b>" +
                        items.length +
                        "</b> of " +
                        total +
                        " books drawn</span>",
                );
                out.push(
                    "<span>box <b>" +
                        r1(Math.min.apply(null, ws)) +
                        "–" +
                        r1(Math.max.apply(null, ws)) +
                        "</b> × <b>" +
                        r1(Math.min.apply(null, hs)) +
                        "–" +
                        r1(Math.max.apply(null, hs)) +
                        "</b> pt</span>",
                );
                if (faces.length) {
                    const worst = Math.min.apply(null, vis);
                    out.push(
                        "<span>aspect <b>" +
                            r2(Math.min.apply(null, asp)) +
                            (r2(Math.min.apply(null, asp)) ===
                            r2(Math.max.apply(null, asp))
                                ? ""
                                : "–" + r2(Math.max.apply(null, asp))) +
                            "</b> vs 0.67</span>",
                    );
                    out.push(
                        "<span>jacket kept <span class=" +
                            (worst > 0.995 ? '"fine"' : '"warn"') +
                            ">" +
                            pct(worst) +
                            "</span></span>",
                    );
                }
                if (spines.length) {
                    out.push(
                        "<span><b>" +
                            spines.length +
                            "</b> drawn as spines — nothing cropped</span>",
                    );
                }
                if (lay.shown !== undefined) {
                    out.push(
                        "<span>each cover <b>" +
                            pct(Math.min(1, lay.shown)) +
                            "</b> visible, " +
                            r1(lay.stepU * ROW_U) +
                            "pt of sliver</span>",
                    );
                }
                if (lay.plan && lay.plan.atCeiling) {
                    out.push(
                        '<span class="warn">at the sliver floor — no geometry left</span>',
                    );
                }
                out.push(
                    "<span>row <span class=" +
                        (usedU <= CARD_UNITS + 0.05 ? '"fine"' : '"warn"') +
                        ">" +
                        r1(usedU) +
                        "</span>/" +
                        CARD_UNITS +
                        " units</span>",
                );
                out.push(
                    "<span>well <span class=" +
                        (hUsed * ROW_U <= WELL_H - PAD + 0.5
                            ? '"fine"'
                            : '"warn"') +
                        ">" +
                        r1(hUsed * ROW_U) +
                        "</span>/" +
                        r1(WELL_H - PAD) +
                        " pt used</span>",
                );
                const widest = Math.max.apply(null, ws);
                if (faces.length) {
                    out.push(
                        "<span>generated titles " +
                            (widest >= GEN_MIN_W
                                ? '<span class="fine">legible</span>'
                                : "suppressed") +
                            "</span>",
                    );
                    const ov = faces.map((i) => overhangOf(i, o));
                    const lost = Math.max.apply(
                        null,
                        ov.map((v) => v.l + v.r),
                    );
                    if (lost > 0.5) {
                        out.push(
                            '<span class="warn">' +
                                r1(lost) +
                                "pt of artwork discarded per cover</span>",
                        );
                    }
                }
                return '<div class="met">' + out.join("") + "</div>";
            }

            /* ---- the options, in the order they are worth considering ---- */

                    lay: (b, o) => layoutToday(b, o),
                    body:
                        "<p><b>The box is not cover-shaped, and <code>BoxFit.cover</code> resolves the disagreement by throwing artwork away.</b> " +

                        "<p>Two separate faults, and they compound. The tier is 0.36 where a cover is 0.67, so ~46% of every jacket goes; and the jitter perturbs width and height <i>independently</i>, so the box aspect wanders between 0.30 and 0.49 and each cover is cropped by a different amount. " +
                        "That second one is why the row reads as broken rather than as a row of small books — flip <i>jitter size, not aspect</i> and the row calms down without a single cover being any less cropped.</p>" +
                        '<div class="cost"><b>Why it shipped:</b> <code>artCoverRow</code> in the sharing mockup fills each cover with a flat colour from <code>PAL</code>. A flat 0.36 rectangle reads as a spine, so the drawing looked right and the geometry was signed off against content that could not show the crop.</div>',
                },
                {

                    badge: ["cheap", "one line"],
                    take: (t) => Math.min(t, COVER_MAX),
                    lay: (b, o) => layoutToday(b, o),

                    body:
                        "<p><code>alignment: Alignment.topLeft</code> on the <code>Image</code>. Identical geometry, identical 46% loss — but the crop now happens off <i>one</i> edge, so a sliced title reads as running off the page rather than as cut in half twice. Spines and the left-hand start of each title survive, which is where Korean and English titles both begin.</p>" +
                        '<div class="cost"><b>Cost:</b> nothing. One argument, no test changes, no geometry changes. <b>Buys:</b> the row stops looking like a rendering fault. It is still cropped, so this is a stopgap and should ship behind whichever real fix wins.</div>',
                },

                        "<p>The row is now honest and slightly shorter, because at true aspect twelve covers across 106 units cannot be tall. Compare it against <code>now</code> at 12 books: this is what the drawing was always describing.</p>" +
                        '<div class="cost"><b>Cost:</b> <code>_tierFor</code> returns one dimension and derives the other; the jitter changes shape. Two assertions in <code>card_cover_row_test.dart</code> move. <b>Buys:</b> zero crop at every count, and the aspect can never drift again because it is no longer typed.</div>',

                        CAP +
                        ", and it is not about size.</b> <code>kCardStampMax</code> is 6, so a row capped at six is a row where the candlelight reveal always prints a date on every cover instead of degrading to the warm mark. The cap and the reveal stop being two unrelated numbers. It costs two more books off the row.</p>" +
                        '<div class="cost"><b>Cost:</b> a new element (the plate) and a card that shows fewer books than the reader owns, stated rather than implied. <b>Buys:</b> the largest covers of any single-shelf option, and a row whose length no longer depends on how much someone reads.</div>',

                        "<p>Under six books nothing changes at all, which is deliberate: the low tiers are already correct and the median reader's card should not be redesigned to fix a defect at n=12.</p>" +

                {

                    t: "Two boards, overlapping when needed",

                        "<p>That last line is the point of the hybrid. Option 5 alone keeps shrinking the covers until 22 books are " +

                        "<p>Use the <i>lean</i> toggle to choose which end of each stack is whole. It is a real trade, not a preference: " +

                        MAX_BOOKS +

                },
                {
                    id: "phase",
                    t: "Phase out behind what you are reading",
                    badge: [null, "parked \u00b7 squeezes"],
                    take: (t) => t,

                        "<p>Keep the geometry exactly and stop pretending a 0.36 rectangle is a face. <code>CardCoverRow</code>'s own doc comment already calls this “a row of cover spines”; this makes it true. At 17pt wide there is no recognisable artwork to lose — the crop is destroying information nobody could read anyway.</p>" +
