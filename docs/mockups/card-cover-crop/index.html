<!doctype html>
<!--
  Design mockup: the library card's cover row, and the crop nobody drew.

  Self-contained. No build, no server, no network -- open it straight from disk.
  There are deliberately no raster images here: every cover is drawn in the DOM
  at the app's own 2/3 aspect and then *fitted into the box the shipped code
  gives it*, which is the one thing the original drawing did not do. See the
  `WHY THIS PAGE EXISTS` note in SECTION 4.

  Sections, in the order they appear in the script:
    SECTION 1  TOKENS    - colours and geometry ported from the Dart
    SECTION 2  HELPERS   - bookHash, colour maths, spineTintFor, the jacket
    SECTION 3  CORPUS    - 22 books, the count in the reported screenshot
    SECTION 4  LAYOUTS   - today's row, and seven alternatives
    SECTION 5  ENGINE    - controls and assembly
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Library Card &mdash; the cover row crop</title>
        <style>
            /* ---- SECTION 1a: product tokens (mirrors lib/constants/app_theme.dart) ---- */
            :root {
                --page: #f8f9fa;
                --surface: #ffffff;
                --text: #212529;
                --text2: #adb5bd;
                --brand: #09bc8a;
                --brandText: #067657;
                --ink: #1c1c1e;
                --muted: #8a8a8f;
                --line: #e6e4e0;

                /* The artifact's own stock. Deliberately not theme tokens -- see
           kCardStock in shareable_library_card.dart for why the card does not
           follow the reader's light/dark setting. */
                --stock: #f2ede0;
                --stockLine: #ddd3bd;
                --cardInk: #1f2d27;
                --flame: #f2a93f;
                --glow: #ffe0a3;

                /* Diagnostic ink. Not a product colour: this is the page talking. */
                --cut: #d92b2b;
            }
            * {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                margin: 0;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--ink);
                background: #fff;
                -webkit-font-smoothing: antialiased;
                line-height: 1.55;
            }
            code {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.86em;
                background: #f2f1ee;
                padding: 0.1em 0.35em;
                border-radius: 4px;
            }
            .gone {
                display: none;
            }

            /* ---------- top chrome ---------- */
            .top {
                position: sticky;
                top: 0;
                z-index: 300;
                background: rgba(255, 255, 255, 0.94);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--line);
            }
            .top-in {
                max-width: 1180px;
                margin: 0 auto;
                padding: 10px 22px;
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
            }
            .brand {
                font-size: 14px;
                font-weight: 800;
                letter-spacing: -0.2px;
                white-space: nowrap;
            }
            .brand span {
                color: var(--brandText);
            }
            .ctl {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
            }
            .seg {
                display: flex;
                gap: 2px;
                background: #f2f1ee;
                border-radius: 20px;
                padding: 2px;
            }
            .seg button {
                font: inherit;
                font-size: 12px;
                font-weight: 700;
                color: var(--muted);
                background: none;
                border: 0;
                padding: 4px 10px;
                border-radius: 16px;
                cursor: pointer;
            }
            .seg button:hover {
                color: var(--ink);
            }
            .seg button.on {
                color: var(--ink);
                background: #fff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            }
            .chk {
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 12px;
                font-weight: 600;
                color: var(--muted);
                cursor: pointer;
                user-select: none;
            }
            .chk input {
                margin: 0;
                accent-color: var(--brandText);
            }
            .chk.on {
                color: var(--ink);
            }

            /* ---------- page ---------- */
            .wrap {
                max-width: 1180px;
                margin: 0 auto;
                padding: 26px 22px 120px;
            }
            h1 {
                font-size: 26px;
                line-height: 1.25;
                letter-spacing: -0.5px;
                margin: 8px 0 12px;
            }
            .lead {
                font-size: 15px;
                color: #43434a;
                max-width: 74ch;
            }
            .lead b {
                color: var(--ink);
            }
            h2 {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.9px;
                color: var(--muted);
                margin: 40px 0 10px;
            }
            .note {
                font-size: 13px;
                color: #5b5b62;
                max-width: 78ch;
            }

            /* the diagnosis table */
            table.diag {
                border-collapse: collapse;
                font-size: 13px;
                margin: 14px 0 6px;
                width: 100%;
                max-width: 720px;
            }
            table.diag th {
                text-align: left;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                color: var(--muted);
                border-bottom: 1px solid var(--line);
                padding: 6px 10px 6px 0;
                font-weight: 700;
            }
            table.diag td {
                padding: 7px 10px 7px 0;
                border-bottom: 1px solid #f1f0ec;
                font-variant-numeric: tabular-nums;
            }
            table.diag tr.bad td {
                color: var(--cut);
                font-weight: 700;
            }
            table.diag tr.good td {
                color: var(--brandText);
            }

            /* ---------- one option ---------- */
            .opt {
                display: grid;
                grid-template-columns: 392px minmax(0, 1fr);
                gap: 26px;
                padding: 22px 0 26px;
                border-top: 1px solid var(--line);
                align-items: start;
            }
            .opt:first-of-type {
                border-top: 0;
            }
            @media (max-width: 900px) {
                .opt {
                    grid-template-columns: 1fr;
                }
            }
            .oh {
                grid-column: 1 / -1;
                display: flex;
                align-items: baseline;
                gap: 10px;
                flex-wrap: wrap;
            }
            .oh .n {
                font-size: 12px;
                font-weight: 800;
                color: var(--text2);
                font-variant-numeric: tabular-nums;
            }
            .oh .t {
                font-size: 19px;
                font-weight: 800;
                letter-spacing: -0.3px;
            }
            .badge {
                font-size: 11px;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                padding: 2px 8px;
                border-radius: 20px;
                background: #f2f1ee;
                color: var(--muted);
            }
            .badge.bug {
                background: #fdecec;
                color: var(--cut);
            }
            .badge.pick {
                background: #e4f7f0;
                color: var(--brandText);
            }
            .badge.cheap {
                background: #eef2fd;
                color: #3a5bbf;
            }
            .body p {
                font-size: 13.5px;
                margin: 0 0 9px;
                color: #43434a;
            }
            .body p b {
                color: var(--ink);
            }
            .body ul {
                margin: 0 0 9px;
                padding-left: 18px;
                font-size: 13.5px;
                color: #43434a;
            }
            .body li {
                margin-bottom: 4px;
            }
            .cost {
                font-size: 12.5px;
                background: #faf9f6;
                border-left: 2px solid var(--line);
                padding: 8px 12px;
                margin: 10px 0 0;
                color: #5b5b62;
            }
            .cost b {
                color: var(--ink);
            }

            /* metrics strip under a stage */
            .met {
                font-size: 11.5px;
                color: var(--muted);
                margin-top: 9px;
                display: flex;
                flex-wrap: wrap;
                gap: 4px 12px;
                font-variant-numeric: tabular-nums;
            }
            .met b {
                color: var(--ink);
                font-weight: 700;
            }
            .met .warn {
                color: var(--cut);
                font-weight: 700;
            }
            .met .fine {
                color: var(--brandText);
                font-weight: 700;
            }

            /* ---------- the artifact ---------- */
            /* The card is drawn at 1px == 1pt, so every number on this page is the
         number the 360x450 export actually uses. */
            .stage {
                width: 360px;
                border-radius: 10px;
                overflow: hidden;
                box-shadow:
                    0 1px 2px rgba(0, 0, 0, 0.1),
                    0 12px 30px rgba(0, 0, 0, 0.1);
            }
            .stage.diag {
                overflow: visible;
            }
            .well {
                position: relative;
                width: 360px;
                overflow: hidden;
                background: linear-gradient(180deg, #faf6ec, #efe7d6);
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
            }
            .stage.diag .well {
                overflow: visible;
            }
            .well.cdl {
                background: linear-gradient(180deg, #35230e, #1b1106);
            }
            /* Gilt: fine ruled foil on the stock, at two weights crossing. Barely
         there in daylight; a flame picks it out, because foil is what catches a
         raking light. */
            .well::before {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;
                background:
                    repeating-linear-gradient(
                        62deg,
                        rgba(31, 45, 39, 0.07) 0 1.36px,
                        transparent 1.36px 8.15px
                    ),
                    repeating-linear-gradient(
                        -62deg,
                        rgba(31, 45, 39, 0.045) 0 1.36px,
                        transparent 1.36px 10.19px
                    );
            }
            .well.cdl::before {
                background:
                    repeating-linear-gradient(
                        62deg,
                        rgba(242, 169, 63, 0.32) 0 1.36px,
                        transparent 1.36px 8.15px
                    ),
                    repeating-linear-gradient(
                        -62deg,
                        rgba(242, 169, 63, 0.2) 0 1.36px,
                        transparent 1.36px 10.19px
                    );
            }
            .seal {
                position: absolute;
                right: 13.58px;
                top: 13.58px;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 1px solid rgba(31, 45, 39, 0.14);
                color: rgba(31, 45, 39, 0.18);
                font-size: 9px;
                font-weight: 800;
                display: flex;
                align-items: center;
                justify-content: center;
                letter-spacing: 0.5px;
            }
            .well.cdl .seal {
                border-color: rgba(242, 169, 63, 0.35);
                color: rgba(242, 169, 63, 0.5);
            }
            .inner {
                position: relative;
                z-index: 1;
                /* 4u, 4u, 4u, 0.8u. The bottom inset is `kCardShelfFloorUnits` and not
                   zero, so the bottom board's shadow has somewhere to fall — without it
                   the well's `ClipRect` eats that shadow on the bottom board alone. It
                   is taken out of the well's slack, not out of the covers, so no
                   capacity on this page moved. */
                padding: 13.58px 13.58px 2.72px;
            }
            /* One shelf: a row of books and the board they stand on.

               **Left-aligned, and every board shares that edge.** Centring each row on
               its own contents makes a partly-filled second board read as a centred stub
               floating under the first rather than as books standing at the left-hand end
               of a shelf -- visible the moment a count lands between capacities, e.g. 25
               spines, which fills the top board and puts five on the bottom one. It also
               matches `.row.stack`, which has been left-aligned all along because a lean
               has a direction; the two were inconsistent until `card_cover_row.dart` drew
               both from one plan and the difference stopped being invisible. */
            .row {
                display: flex;
                align-items: flex-end;
                justify-content: flex-start;
                position: relative;
            }
            .row.stack {
                display: block;
                position: relative;
            }
            .board {
                height: 5.43px;
                background: var(--stockLine);
                margin-top: 4.75px;
                /* Square ends and a cast shadow, both ported from `ShelfWidget`: an 8pt
                   plank under `offset (0, 2)`, `blurRadius: 2`, ink at a quarter, and no
                   radius at all. 1.36px is a quarter of the board. A radius of 1u on a
                   1.6u bar made it a pill, which is an underline for the row rather than
                   the furniture the row stands on; the shadow is what makes the books
                   read as standing on it. */
                box-shadow: 0 1.36px 1.36px rgba(31, 45, 39, 0.25);
            }
            .well.cdl .board {
                background: #6b4a1f;
                box-shadow: 0 0 6.8px var(--flame);
            }
            .shelf + .shelf {
                margin-top: 6px;
            }

            /* ---------- one book ---------- */
            .bk {
                position: relative;
                flex: 0 0 auto;
                border-radius: 1.7px 3.74px 3.74px 1.7px;
                box-shadow: 1.7px 1.7px 5.1px rgba(0, 0, 0, 0.28);
            }
            .well.cdl .bk {
                filter: saturate(0.8) brightness(0.74) sepia(0.12);
                box-shadow: 0 0 8.5px rgba(242, 169, 63, 0.42);
            }
            /* The clip. Separate from `.bk` so the diagnostic ghost can escape it --
         this is the element that stands in for ClipRRect in the Dart. */
            .bk .cl {
                position: absolute;
                inset: 0;
                overflow: hidden;
                border-radius: inherit;
            }
            /* The binding band: what makes the eye read "a book seen slightly from
         the side". Align(centerLeft, width: 1.2 * unit) in the Dart. */
            .bk .bnd {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.18);
                border-radius: inherit;
            }
            .well.cdl .bk .bnd {
                background: rgba(0, 0, 0, 0.42);
            }

            /* The jacket: a cover with something printed on it, at the app's own 2/3.
         Absolutely positioned and sized by JS to whatever BoxFit would produce,
         so the crop on this page is the crop in the export. */
            .jk {
                position: absolute;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .jk b {
                font-weight: 800;
                line-height: 1.1;
                letter-spacing: -0.2px;
                display: block;
            }
            .jk i {
                font-style: normal;
                font-weight: 600;
                line-height: 1.15;
                opacity: 0.82;
                display: block;
            }
            .jk .rule {
                display: block;
                height: 1px;
                background: currentColor;
                opacity: 0.5;
            }
            /* Three jacket layouts, so the row is not twelve of the same drawing and
         so the crop is visibly destroying different things in different books. */
            .jk.s0 {
                justify-content: flex-start;
            }
            .jk.s1 {
                justify-content: center;
                text-align: center;
            }
            .jk.s2 {
                justify-content: flex-end;
            }
            .jk.s2 .band {
                position: absolute;
                left: 0;
                right: 0;
                top: 38%;
                background: rgba(0, 0, 0, 0.28);
            }
            /* GeneratedCover, as generated_cover.dart draws it: colour block, then
         title lines. Two books in the corpus have no thumbnail. */
            .jk.gen {
                justify-content: flex-start;
            }
            .jk.gen .blk {
                display: block;
                height: 46%;
                background: rgba(0, 0, 0, 0.18);
            }

            /* The ghost: the part of the jacket the box throws away. Only in
         diagnostic mode. */
            .gh {
                position: absolute;
                opacity: 0.3;
                filter: grayscale(0.2);
                pointer-events: none;
            }
            .cutline {
                position: absolute;
                inset: 0;
                border: 1px dashed var(--cut);
                border-radius: inherit;
                pointer-events: none;
                z-index: 3;
            }

            /* A spine, for the options that draw one instead of a cropped face. */
            .sp {
                position: absolute;
                inset: 0;
                overflow: hidden;
                border-radius: inherit;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .sp .ttl {
                writing-mode: vertical-rl;
                text-orientation: mixed;
                transform: rotate(180deg);
                white-space: nowrap;
                overflow: hidden;
                color: #fff;
                font-weight: 700;
                letter-spacing: 0.2px;
            }
            .sp .band {
                position: absolute;
                left: 0;
                right: 0;
                height: 1px;
                background: rgba(255, 255, 255, 0.35);
            }

            /* A currently-reading book's ribbon.

               Hangs over the head of the cover, so it sticks out above the row. Drawn
               outside `.cl` deliberately: that is the element standing in for
               ClipRRect, and a bookmark that a clip swallows is not a bookmark. */
            .bk .ribbon {
                position: absolute;
                z-index: 4;
                background: #c0392b;
                border-radius: 1px;
            }
            .bk .ribbon::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                bottom: -2px;
                height: 3px;
                background: inherit;
                clip-path: polygon(0 0, 100% 0, 50% 100%);
            }

            /* The hairline the read pile draws between spines. On a sliver it is the
               only thing separating one book from the next. */
            .sp .sep {
                position: absolute;
                top: 0;
                bottom: 0;
                right: 0;
                width: 1px;
                background: rgba(0, 0, 0, 0.3);
            }

            /* The overflow plate, for the option that caps the row. Drawn in the
         stamp's own style rather than as a new visual language. */
            .plate {
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 3.4px;
                border: 1px solid var(--stockLine);
                color: rgba(31, 45, 39, 0.55);
                font-weight: 800;
                background: rgba(255, 255, 255, 0.35);
                font-variant-numeric: tabular-nums;
            }
            .well.cdl .plate {
                border-color: var(--flame);
                color: var(--glow);
                background: rgba(0, 0, 0, 0.35);
            }

            /* The month stamp and the mark it degrades to past six covers. Carried
         over verbatim so the candlelight reveal can be judged against each
         option rather than only against today's. */
            .stamp {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(-11deg);
                white-space: nowrap;
                font-weight: 800;
                color: var(--glow);
                border: 1.7px solid var(--flame);
                border-radius: 3.4px;
                padding: 0 4px;
                background: rgba(0, 0, 0, 0.4);
                text-shadow: 0 0 6.8px var(--flame);
                z-index: 2;
            }
            .mark {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 5.43px;
                height: 5.43px;
                margin: -2.71px 0 0 -2.71px;
                border-radius: 50%;
                background: var(--glow);
                box-shadow: 0 0 6.8px var(--flame);
                z-index: 2;
            }

            /* The body of the card under the well, drawn flat and small: the options
         must be judged against the whole artifact, because the well's height is
         the budget every one of them is spending. */
            .cbody {
                background: var(--stock);
                padding: 12px 13.58px 14px;
                color: var(--cardInk);
                display: flex;
                flex-direction: column;
            }
            .cbody.cdl {
                background: linear-gradient(180deg, #efe3cc, #d8c9a8);
            }
            .cbody .ttl {
                font-size: 15px;
                font-weight: 800;
                color: var(--brandText);
                letter-spacing: -0.2px;
            }
            .cbody .sub {
                font-size: 7.5px;
                font-weight: 700;
                letter-spacing: 0.8px;
                color: rgba(31, 45, 39, 0.55);
                margin-bottom: 8px;
            }
            .cbody .rec {
                display: flex;
                gap: 14px;
                align-items: flex-start;
            }
            .cbody .fig {
                font-size: 40px;
                font-weight: 800;
                line-height: 0.92;
                letter-spacing: -1.5px;
            }
            .cbody .fig s {
                display: block;
                font-size: 13px;
                font-weight: 700;
                text-decoration: none;
                color: var(--brandText);
            }
            .cbody .rows {
                font-size: 8.5px;
                display: grid;
                grid-template-columns: 68px 1fr;
                row-gap: 2px;
                padding-top: 3px;
            }
            .cbody .rows i {
                font-style: normal;
                color: rgba(31, 45, 39, 0.55);
            }
            .cbody .rows b {
                font-weight: 800;
            }
            .cbody .stats {
                display: flex;
                gap: 22px;
                margin-top: 12px;
                padding-top: 9px;
                border-top: 1px solid var(--stockLine);
            }
            .cbody .stats div {
                font-size: 8.5px;
                color: rgba(31, 45, 39, 0.55);
                line-height: 1.35;
            }
            .cbody .stats b {
                display: block;
                font-size: 13px;
                font-weight: 800;
                color: var(--cardInk);
            }
            .cbody .mrz {
                margin-top: auto;
                padding-top: 7px;
                border-top: 1px solid var(--stockLine);
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 7.5px;
                letter-spacing: 0.4px;
                color: rgba(31, 45, 39, 0.7);
                word-break: break-all;
            }

            /* ---------- the crop callout ---------- */
            .zoom {
                margin-top: 12px;
                padding: 12px 14px 14px;
                background: #fdf7f7;
                border: 1px solid #f6dede;
                border-radius: 8px;
            }
            .zh {
                font-size: 11.5px;
                font-weight: 700;
                color: var(--cut);
                margin-bottom: 10px;
            }
            .zrow {
                display: flex;
                gap: 14px;
                align-items: flex-end;
            }
            .zc {
                position: relative;
            }
            .zwin {
                position: absolute;
                overflow: hidden;
                outline: 1.5px solid var(--cut);
                z-index: 2;
            }
            .zcap {
                font-size: 10.5px;
                color: var(--muted);
                margin-top: 5px;
            }
            .zcap b {
                color: var(--cut);
            }

            /* ---------- the display options popover ----------

               Preview chrome, and drawn as chrome on purpose: it must not appear in the
               PNG. In the app it lives behind the button at the card's top right, beside
               the framing and Candlelight controls that share_card_page.dart already has. */
            .stagewrap {
                position: relative;
                width: 360px;
            }
            .dispbtn {
                position: absolute;
                top: -10px;
                right: -10px;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: #fff;
                border: 1px solid var(--line);
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
                font-weight: 800;
                color: var(--muted);
                z-index: 20;
            }
            .dispmenu {
                position: relative;
                width: 190px;
                margin: 12px 0 0 auto;
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 10px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
                padding: 8px;
                z-index: 21;
            }
            /* The caret points back at the button it belongs to. The panel flows below the
               card rather than floating over it, so that a screenshot shows the shelf and
               the control it is set by at the same time; in the app it opens downward from
               the button in the usual way. */
            .dispmenu::before {
                content: "";
                position: absolute;
                top: -5px;
                right: 12px;
                width: 9px;
                height: 9px;
                background: #fff;
                border-left: 1px solid var(--line);
                border-top: 1px solid var(--line);
                transform: rotate(45deg);
            }
            .dispmenu .dh {
                font-size: 9.5px;
                text-transform: uppercase;
                letter-spacing: 0.7px;
                font-weight: 800;
                color: var(--text2);
                padding: 4px 6px 3px;
            }
            .dispmenu button {
                display: flex;
                align-items: center;
                gap: 6px;
                width: 100%;
                font: inherit;
                font-size: 11.5px;
                font-weight: 600;
                text-align: left;
                background: none;
                border: 0;
                padding: 5px 6px;
                border-radius: 6px;
                cursor: pointer;
                color: var(--ink);
            }
            .dispmenu button:hover {
                background: #f4f3f0;
            }
            .dispmenu button::before {
                content: "";
                width: 12px;
                height: 12px;
                border-radius: 50%;
                border: 1.5px solid var(--line);
                flex: 0 0 auto;
            }
            .dispmenu button.on {
                font-weight: 800;
            }
            .dispmenu button.on::before {
                border-color: var(--brandText);
                background: radial-gradient(
                    circle,
                    var(--brandText) 0 3px,
                    transparent 3px
                );
            }
            .dispmenu button[disabled] {
                opacity: 0.38;
                cursor: default;
            }
            .dispmenu .dcap {
                font-size: 9.5px;
                color: var(--muted);
                padding: 4px 6px 2px;
                border-top: 1px solid var(--line);
                margin-top: 5px;
                line-height: 1.4;
            }
            .chromenote {
                font-size: 10.5px;
                color: var(--cut);
                margin-top: 8px;
                font-weight: 600;
            }

            /* ---------- grid view ---------- */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 22px;
            }
            .gcell .gh2 {
                font-size: 12.5px;
                font-weight: 800;
                margin: 0 0 8px;
                display: flex;
                gap: 8px;
                align-items: baseline;
            }
            .gcell .gh2 .n {
                color: var(--text2);
                font-variant-numeric: tabular-nums;
            }
            .gzoom {
                width: 300px;
                height: 250px;
                overflow: hidden;
            }
            .gzoom > .stage {
                transform: scale(0.8333);
                transform-origin: top left;
            }
            .foot {
                margin-top: 60px;
                border-top: 1px solid var(--line);
                padding-top: 18px;
                font-size: 12.5px;
                color: var(--muted);
                max-width: 80ch;
            }
            .foot code {
                font-size: 0.9em;
            }
        </style>
    </head>
    <body>
        <div class="top">
            <div class="top-in">
                <span class="brand"
                    >Library Card &mdash; <span>the cover row crop</span></span
                >
                <div class="ctl">
                    <span>books</span>
                    <div class="seg" id="seg-n"></div>
                </div>
                <div class="ctl">
                    <span>light</span>
                    <div class="seg" id="seg-light"></div>
                </div>
                <div class="ctl">
                    <span>view</span>
                    <div class="seg" id="seg-view"></div>
                </div>
                <div class="ctl">
                    <span>reading</span>
                    <div class="seg" id="seg-reading"></div>
                </div>
                <div class="ctl">
                    <span>lean</span>
                    <div class="seg" id="seg-lean"></div>
                </div>
                <label class="chk" id="lab-diag"
                    ><input type="checkbox" id="cb-diag" /> show what is
                    cropped</label
                >
                <label class="chk" id="lab-jit"
                    ><input type="checkbox" id="cb-jit" /> jitter size, not
                    aspect</label
                >
            </div>
        </div>

        <div class="wrap">
            <h1 id="h1"></h1>
            <p class="lead" id="lead"></p>
            <table class="diag" id="tbl"></table>
            <p class="note" id="tblnote"></p>

            <h2 id="opts-h">The options</h2>
            <div id="opts"></div>
            <div class="grid gone" id="gridv"></div>

            <h2 id="shelf-h">Capacity, with nothing squeezed</h2>
            <p class="lead" id="shelf-lead"></p>
            <table class="diag" id="shelf-tbl"></table>
            <p class="note" id="shelf-note"></p>
            <div class="grid" id="shelf-grid" style="margin-top: 22px"></div>

            <h2 id="cap-h">How many books two boards can hold</h2>
            <p class="lead" id="cap-lead"></p>
            <table class="diag" id="cap-tbl"></table>
            <p class="note" id="cap-note"></p>
            <div class="grid" id="cap-grid" style="margin-top: 22px"></div>

            <h2 id="cap2-h">And how many the phase-out can</h2>
            <p class="lead" id="cap2-lead"></p>
            <table class="diag" id="cap2-tbl"></table>
            <p class="note" id="cap2-note"></p>
            <div class="grid" id="cap2-grid" style="margin-top: 22px"></div>

            <div class="foot" id="foot"></div>
        </div>

        <script>
            /* ====================================================================
            SECTION 1b: geometry, ported from the Dart.

            Every number below is read off a named constant in the codebase. The
            page draws at 1 CSS px == 1 layout point, so these are the export's own
            numbers and nothing here is a guess about scale.
            ==================================================================== */

            /* kShareableCardSize -- portrait 4:5, 1080x1350 at the 3x export. */
            const CARD_W = 360,
                CARD_H = 450;

            /* _kWellFraction in shareable_library_card.dart. */
            const WELL_FRAC = 0.46;
            const WELL_H = CARD_H * WELL_FRAC; /* 207 */

            /* _u -- the card's drawing unit. The artifact is laid out as 106 * u. */
            const CARD_UNITS = 106;
            const U = CARD_W / CARD_UNITS; /* 3.396 */

            /* The well's padding: EdgeInsets.fromLTRB(4u, 4u, 4u, 0). */
            const PAD = 4 * U;

            /* The width CardCoverRow is actually handed. It is given no `width`, so it
            measures the well's *inner* box -- and then divides that by 106. So the
            row's unit is 7.5% smaller than the card's, and every cover is drawn
            7.5% smaller than `docs/mockups/library-card-share/index.html` drew it,
            which sizes `.acvr i` off `--u` directly. Faithfully reproduced here
            rather than quietly corrected: it is a real (small) deviation, and it is
            the kind of thing this page exists to surface. */
            const INNER_W = CARD_W - 2 * PAD; /* 332.83 */
            const ROW_U = INNER_W / CARD_UNITS; /* 3.140 */

            /* _kGapUnits. */
            const GAP_U = 1.6;

            /* The shelf board and the air above it, from _Well. */
            const BOARD_U = 1.6,
                BOARD_GAP_U = 1.4;

            /* kDefaultCoverAspect in book_geometry.dart: width / height. This is the
            number the tiers are supposed to agree with and mostly do not. */
            const ASPECT = 2 / 3;

            /* kCardCoverMax, and kCardStampMax. */
            const COVER_MAX = 12,
                STAMP_MAX = 6;

            /* kGeneratedCoverMinWidth: 7 / 0.135, the width below which a generated
            cover stops drawing its title because the title would land under 7pt. */
            const GEN_MIN_W = 7 / 0.135; /* 51.85 */

            /* How much vertical room the row has, in row-units, once the well's top
            padding, the board and the air above it are taken. Derived rather than
            typed, because the whole argument for two shelves is that this number is
            much larger than anything the row spends today. */
            const H_BUDGET_U =
                (WELL_H - PAD - (BOARD_U + BOARD_GAP_U) * U) / ROW_U;

            /* kGeneratedCoverPalette, verbatim from generated_cover.dart. */
            const COVER_PALETTE = [
                "#09BC8A" /* brand green */,
                "#0E7C7B" /* deep teal   */,
                "#2F6690" /* slate blue  */,
                "#E0644E" /* coral       */,
                "#F2B544" /* amber       */,
                "#7C5CBF" /* violet      */,
            ];

            /* ====================================================================
            SECTION 2: helpers
            ==================================================================== */

            const esc = (s) =>
                String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            const r1 = (n) => Math.round(n * 10) / 10;
            const r2 = (n) => Math.round(n * 100) / 100;
            const pct = (n) => Math.round(n * 100) + "%";

            /* ---- bookHash, ported from book_geometry.dart ----

            FNV-1a over the UTF-16 code units, low byte first. The Dart splits the
            prime multiply so no intermediate exceeds 2^53, because this project has
            a web target where `int` is a double; the same split is used here, plus
            `>>> 0` after each XOR, because JS bitwise operators produce a *signed*
            int32 and a negative hash would make `% 3` negative and the jitter
            asymmetric. Pinned against the Dart's own goldens in verify.js. */
            function fnvStep(h, byte) {
                const x = (h ^ byte) >>> 0;
                return ((x & 0xff) * 16777216 + x * 403) % 4294967296;
            }
            function bookHash(s) {
                let h = 0x811c9dc5;
                for (let i = 0; i < s.length; i++) {
                    const u = s.charCodeAt(i);
                    h = fnvStep(h, u & 0xff);
                    if (u > 0xff) h = fnvStep(h, (u >> 8) & 0xff);
                }
                return h;
            }

            /* ---- colour maths, ported from book_chassis.dart via
                 docs/mockups/read-pile-turn. Kept in step with that page: it is the
                 design record for the shipped spineTintFor, and two drawings that
                 disagree are worse than one. ---- */
            function hexRgb(h) {
                return [
                    parseInt(h.slice(1, 3), 16),
                    parseInt(h.slice(3, 5), 16),
                    parseInt(h.slice(5, 7), 16),
                ];
            }
            function lin(v) {
                v /= 255;
                return v <= 0.03928
                    ? v / 12.92
                    : Math.pow((v + 0.055) / 1.055, 2.4);
            }
            function luminance(h) {
                const c = hexRgb(h);
                return (
                    0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2])
                );
            }
            function contrastRatio(a, b) {
                const l1 = Math.max(luminance(a), luminance(b));
                const l2 = Math.min(luminance(a), luminance(b));
                return (l1 + 0.05) / (l2 + 0.05);
            }
            function hexOf(c) {
                return (
                    "#" +
                    c
                        .map((v) =>
                            Math.max(0, Math.min(255, Math.round(v)))
                                .toString(16)
                                .padStart(2, "0"),
                        )
                        .join("")
                );
            }
            function mix(a, b, t) {
                const x = hexRgb(a),
                    y = hexRgb(b);
                return hexOf([
                    x[0] + (y[0] - x[0]) * t,
                    x[1] + (y[1] - x[1]) * t,
                    x[2] + (y[2] - x[2]) * t,
                ]);
            }
            function saturation(h) {
                const c = hexRgb(h);
                const mx = Math.max.apply(null, c),
                    mn = Math.min.apply(null, c);
                return mx === 0 ? 0 : (mx - mn) / mx;
            }
            function bookBoardColorFor(h) {
                const t = 0.18 + 0.3 * luminance(h);
                return hexOf(hexRgb(h).map((v) => v * (1 - t)));
            }
            const kTintMinSaturation = 0.18,
                kTintChromaLift = 0.45,
                kTintMinContrast = 4.6;
            function spineTintFor(cover) {
                const s = saturation(cover);
                const lift =
                    Math.max(0, (kTintMinSaturation - s) / kTintMinSaturation) *
                    luminance(cover) *
                    kTintChromaLift;
                let c = bookBoardColorFor(mix(cover, "#09BC8A", lift));
                for (
                    let i = 0;
                    i < 24 && contrastRatio(c, "#FFFFFF") < kTintMinContrast;
                    i++
                ) {
                    c = mix(c, "#000000", 0.06);
                }
                return c;
            }
            function generatedCoverColor(isbn) {
                if (!isbn) return COVER_PALETTE[0];
                return COVER_PALETTE[bookHash(isbn) % COVER_PALETTE.length];
            }

            /* ====================================================================
            SECTION 3: the corpus

            22 books, because 22 is the count on the card in the report. Mixed
            Korean and English, in the proportion the live library is in -- which
            matters more here than it looks: a centre crop takes the middle of a
            line, and a Korean title set in four wide glyphs loses a different thing
            than an English one set in twelve narrow ones.

            `c` is the colour books.cover_color stores (the sampled average of the
            real jacket). The last two carry no thumbnail, so they draw a
            GeneratedCover and exercise the fallback path in _face().

            Order is finish-date descending, which is the order cardCoverBooks puts
            them in and the order the row draws: most recently finished leftmost.
            ==================================================================== */
            const CORPUS = [
                ["9780857197689", "Shoe Dog", "Phil Knight", "#C5442E", 0],
                ["9781444758993", "Red Rising", "Pierce Brown", "#8E1B1B", 2],
                [
                    "9781649374042",
                    "Fourth Wing",
                    "Rebecca Yarros",
                    "#6B1220",
                    1,
                ],
                [
                    "9780375826696",
                    "Eragon",
                    "Christopher Paolini",
                    "#1F5FA0",
                    1,
                ],
                ["9788932473901", "불편한 편의점", "김호연", "#2E7D6B", 0],
                [
                    "9780241258767",
                    "The Art of Statistics",
                    "D. Spiegelhalter",
                    "#E8E4D8",
                    2,
                ],
                ["9788954682152", "도둑맞은 집중력", "요한 하리", "#F2F0EA", 0],
                [
                    "9788937462788",
                    "위대한 개츠비",
                    "F. 스콧 피츠제럴드",
                    "#12213F",
                    1,
                ],
                ["9781593278748", "Hacking", "Jon Erickson", "#151515", 2],
                ["9788901260716", "세이노의 가르침", "세이노", "#D9D5C8", 0],
                ["9780062316110", "Sapiens", "Yuval Noah Harari", "#E4C56B", 1],
                ["9788936434120", "하얼빈", "김훈", "#1B3A2F", 0],
                ["9780451524935", "1984", "George Orwell", "#B02418", 2],
                [
                    "9788932917245",
                    "소크라테스 익스프레스",
                    "에릭 와이너",
                    "#3A6EA5",
                    0,
                ],
                [
                    "9780141439518",
                    "Pride and Prejudice",
                    "Jane Austen",
                    "#2F6690",
                    1,
                ],
                ["9788934942467", "원씽", "게리 켈러", "#EFA31D", 2],
                ["9791188331796", "아몬드", "손원평", "#7C5CBF", 0],
                ["9780735211292", "Atomic Habits", "James Clear", "#F5E9D0", 1],
                ["9788954699914", "소년이 온다", "한강", "#8C8577", 0],
                [
                    "9780553380163",
                    "A Brief History of Time",
                    "S. Hawking",
                    "#0E1B3A",
                    2,
                ],
                [
                    "9788937473135",
                    "트렌드 코리아 2026",
                    "김난도",
                    "#E0644E",
                    1,
                    false,
                ],
                ["OL12345W", "채식주의자", "한강", "#D6D2C4", 0, false],
            ].map(([isbn, title, author, c, st, thumb]) => ({
                isbn,
                title,
                author,
                c,
                st,
                thumb: thumb !== false,
                /* The month the flame stamps, from cardStampMonth. Fixed per book rather
              than from a date, because nothing on this page depends on when it is
              opened. */
                m: ["SEP", "AUG", "JUL", "JUN", "MAY", "APR"][
                    bookHash(isbn) % 6
                ],
            }));

            /* The books the reader has open right now.

               Kept out of CORPUS rather than mixed into it, because CORPUS is
               finish-date-descending and every other option on this page draws from it:
               a reading book has no `finish_date`, so it has no place in that order and
               nothing to stamp. Three of them, because three is the front group's cap
               (`kCardReadingMax`) and a drawing that cannot reach the cap cannot show what
               it costs -- the `reading` control still opens at two, which is what the median
               reader has open.

               These are the books the card does not show today at all. Whether they
               belong on it is the open question in the `phase` option's notes. */
            const READING = [
                ["9788954699913", "재팬토필", "이보람", "#1F5F4B", 0],
                [
                    "9780593135204",
                    "Project Hail Mary",
                    "Andy Weir",
                    "#2B3A55",
                    1,
                ],
                [
                    "9780571364909",
                    "Klara and the Sun",
                    "Kazuo Ishiguro",
                    "#E9E4D6",
                    2,
                ],
            ].map(([isbn, title, author, c, st]) => ({
                isbn,
                title,
                author,
                c,
                st,
                thumb: true,
                reading: true,
                /* No month: cardStampMonth returns null without a finish_date, and an
                   unstamped cover in a stamped row is better than a stamp reading a date
                   nobody recorded. */
                m: null,
            }));

            function readingFor(k) {
                return READING.slice(0, k);
            }

            /* The corpus, extended past its own length.

               The capacity ladder asks for 60 and 100 books and the drawn corpus is
               22, so beyond that the list repeats with a suffixed ISBN. The suffix is
               not cosmetic: every jitter, palette pick and stamp month on this page
               comes from `bookHash(isbn)`, so a repeat with the same ISBN would draw
               the same book at the same size and the row would visibly tile. */
            function booksFor(n) {
                if (n <= CORPUS.length) return CORPUS.slice(0, n);
                const out = [];
                for (let i = 0; i < n; i++) {
                    const b = CORPUS[i % CORPUS.length];
                    if (i < CORPUS.length) {
                        out.push(b);
                        continue;
                    }
                    const isbn = b.isbn + "-" + Math.floor(i / CORPUS.length);
                    out.push(
                        Object.assign({}, b, {
                            isbn,
                            m: ["SEP", "AUG", "JUL", "JUN", "MAY", "APR"][
                                bookHash(isbn) % 6
                            ],
                        }),
                    );
                }
                return out;
            }

            /* ====================================================================
                SECTION 4a: drawing one book

                WHY THIS PAGE EXISTS

                `artCoverRow` in docs/mockups/library-card-share/index.html fills every
                cover with `PAL[k % PAL.length]` -- a flat colour. At the small tier's
                0.36 aspect a flat rectangle reads as a *spine*, which is what
                card_cover_row.dart's own doc comment claims the row is. The build then
                put a front cover in that spine-shaped hole with `BoxFit.cover`, and a
                centre crop threw away nearly half of each jacket.

                So every cover here is drawn at ASPECT with something printed on it, and
                then fitted the way the widget fits it. A flat swatch cannot show this
                bug and did not.
                ==================================================================== */

            /* What BoxFit.cover does, in numbers. `ax`/`ay` are the Alignment. */
            function fitCover(bw, bh, ax, ay) {
                const sw = Math.max(bw, bh * ASPECT);
                const sh = sw / ASPECT;
                return {
                    sw,
                    sh,
                    l: (bw - sw) * ax,
                    t: (bh - sh) * ay,
                    vis: (bw * bh) / (sw * sh),
                };
            }

            /* The jacket itself: a cover with a title, an author and some furniture on
                it, at ASPECT. `boxW` is the *box* width rather than the art's, because
                that is what _fallback() measures against kGeneratedCoverMinWidth. */
            function jacketSpan(b, f, left, top, cls, boxW) {
                const pos =
                    "width:" +
                    r2(f.sw) +
                    "px;height:" +
                    r2(f.sh) +
                    "px;left:" +
                    r2(left) +
                    "px;top:" +
                    r2(top) +
                    "px;";

                if (!b.thumb) {
                    const gen = generatedCoverColor(b.isbn);
                    /* Below the floor the app draws the colour block alone: the title is
                    13.5% of the width, so a narrower cover sets it under 7pt and it
                    reads as a smudge. Phase 4 shipped exactly that. */
                    if (boxW < GEN_MIN_W) {
                        return (
                            '<span class="jk gen ' +
                            cls +
                            '" style="' +
                            pos +
                            "background:" +
                            gen +
                            '"></span>'
                        );
                    }
                    return (
                        '<span class="jk gen ' +
                        cls +
                        '" style="' +
                        pos +
                        'background:#efe7d6;color:#1f2d27">' +
                        '<span class="blk" style="background:' +
                        gen +
                        '"></span><b style="font-size:' +
                        r2(Math.max(2, f.sw * 0.135)) +
                        "px;padding:" +
                        r2(f.sw * 0.08) +
                        "px " +
                        r2(f.sw * 0.09) +
                        'px">' +
                        esc(b.title) +
                        "</b></span>"
                    );
                }

                const ink = luminance(b.c) < 0.45 ? "#ffffff" : "#1a1a12";
                const pad = f.sw * 0.095;
                const ts = Math.max(2, f.sw * (b.st === 1 ? 0.165 : 0.142));
                const as = Math.max(1.4, f.sw * 0.07);
                const bg =
                    "linear-gradient(158deg," +
                    mix(b.c, "#ffffff", 0.12) +
                    "," +
                    mix(b.c, "#000000", 0.24) +
                    ")";
                let inner;
                if (b.st === 0) {
                    inner =
                        '<b style="font-size:' +
                        r2(ts) +
                        'px">' +
                        esc(b.title) +
                        '</b><span class="rule" style="margin:' +
                        r2(pad * 0.55) +
                        'px 0"></span><i style="font-size:' +
                        r2(as) +
                        'px;margin-top:auto">' +
                        esc(b.author) +
                        "</i>";
                } else if (b.st === 1) {
                    inner =
                        '<b style="font-size:' +
                        r2(ts) +
                        'px">' +
                        esc(b.title) +
                        '</b><i style="font-size:' +
                        r2(as) +
                        "px;margin-top:" +
                        r2(pad * 0.6) +
                        'px">' +
                        esc(b.author) +
                        "</i>";
                } else {
                    inner =
                        '<span class="band" style="height:' +
                        r2(f.sh * 0.05) +
                        'px"></span><b style="font-size:' +
                        r2(ts) +
                        'px">' +
                        esc(b.title) +
                        '</b><i style="font-size:' +
                        r2(as) +
                        "px;margin-top:" +
                        r2(pad * 0.35) +
                        'px">' +
                        esc(b.author) +
                        "</i>";
                }
                return (
                    '<span class="jk s' +
                    b.st +
                    " " +
                    cls +
                    '" style="' +
                    pos +
                    "background:" +
                    bg +
                    ";color:" +
                    ink +
                    ";padding:" +
                    r2(pad) +
                    'px">' +
                    inner +
                    "</span>"
                );
            }

            /* The flame's reveal, carried through every option unchanged so it can be
                judged against each one: a date at STAMP_MAX covers or fewer, a warm
                mark past that. FittedBox(scaleDown) in the Dart becomes a min() here. */
            function flameBits(b, wPt, o) {
                if (!o.lit) return "";
                /* A reading book has no finish month to stamp, and cardStampMonth returns
                   null for exactly that reason. It takes the mark instead. */
                if (o.stamped && b.m) {
                    return (
                        '<span class="stamp" style="font-size:' +
                        r2(Math.min(2.8 * ROW_U, wPt * 0.4)) +
                        'px">' +
                        b.m +
                        "</span>"
                    );
                }
                return o.marked || (o.stamped && !b.m)
                    ? '<span class="mark"></span>'
                    : "";
            }

            function boxStyle(it, wPt, hPt) {
                let s = "width:" + r2(wPt) + "px;height:" + r2(hPt) + "px;";
                /* A face at the front of a pressed row carries its own gap, because the
                   row itself has none: spines behind it are shelved touching, which is
                   what books on a shelf do. */
                if (it.gap) s += "margin-right:" + r2(GAP_U * ROW_U) + "px;";
                if (it.xU !== undefined) {
                    s +=
                        "position:absolute;bottom:0;left:" +
                        r2(it.xU * ROW_U) +
                        "px;z-index:" +
                        it.z +
                        ";";
                }
                return s;
            }

            /* A cover, face out. */
            function faceHtml(it, o) {
                const wPt = it.wU * ROW_U,
                    hPt = it.hU * ROW_U;
                const ax = o.ax === undefined ? 0.5 : o.ax;
                const ay = o.ay === undefined ? 0.5 : o.ay;
                const f = fitCover(wPt, hPt, ax, ay);
                const cropped = f.vis < 0.995;
                /* The bookmark, on a book that is still open. Two thirds of the way
                   across, hanging 5% of the height over the head. */
                const ribbon = it.b.reading
                    ? '<span class="ribbon" style="left:' +
                      r2(wPt * 0.66) +
                      "px;width:" +
                      r2(Math.max(2, wPt * 0.1)) +
                      "px;top:" +
                      r2(-hPt * 0.05) +
                      "px;height:" +
                      r2(hPt * 0.34) +
                      'px"></span>'
                    : "";
                return (
                    '<i class="bk" style="' +
                    boxStyle(it, wPt, hPt) +
                    '">' +
                    (o.diag && cropped
                        ? jacketSpan(it.b, f, f.l, f.t, "gh", wPt)
                        : "") +
                    '<span class="cl">' +
                    jacketSpan(it.b, f, f.l, f.t, "", wPt) +
                    '</span><span class="bnd" style="width:' +
                    r2(1.2 * ROW_U) +
                    'px"></span>' +
                    ribbon +
                    flameBits(it.b, wPt, o) +
                    (o.diag && cropped ? '<span class="cutline"></span>' : "") +
                    "</i>"
                );
            }

            /* A spine. No fit, no crop: the tone is spineTintFor of the stored
                books.cover_color, which is what the read pile already does. */
            function spineHtml(it, o) {
                const wPt = it.wU * ROW_U,
                    hPt = it.hU * ROW_U;
                const cover = it.b.thumb
                    ? it.b.c
                    : generatedCoverColor(it.b.isbn);
                const tint = spineTintFor(cover);
                const titled = it.kind !== "sliver";
                const fs = Math.min(wPt * SPINE_TITLE_RATIO, 6.5);
                return (
                    '<i class="bk" style="' +
                    boxStyle(it, wPt, hPt) +
                    "background:" +
                    tint +
                    '"><span class="sp">' +
                    (titled
                        ? '<span class="band" style="top:' +
                          r2(hPt * 0.07) +
                          'px"></span><span class="band" style="bottom:' +
                          r2(hPt * 0.07) +
                          'px"></span>' +
                          '<span class="ttl" style="font-size:' +
                          r2(fs) +
                          "px;max-height:" +
                          r2(hPt * 0.78) +
                          'px">' +
                          esc(it.b.title) +
                          "</span>"
                        : /* A sliver: tone and a separator, and it stops claiming to say
                             which book it is. The hairline is the read pile's own. */
                          '<span class="sep"></span>') +
                    "</span>" +
                    (it.b.reading
                        ? '<span class="ribbon" style="left:' +
                          r2(wPt * 0.3) +
                          "px;width:" +
                          r2(Math.max(1.5, wPt * 0.22)) +
                          "px;top:" +
                          r2(-hPt * 0.05) +
                          "px;height:" +
                          r2(hPt * 0.3) +
                          'px"></span>'
                        : "") +
                    flameBits(it.b, wPt, o) +
                    "</i>"
                );
            }

            function itemHtml(it, o) {
                return it.kind === "face" ? faceHtml(it, o) : spineHtml(it, o);
            }

            /* ====================================================================
                SECTION 4b: the layouts

                Each returns rows of items measured in *drawing units*, so the width
                check against CARD_UNITS is the same check the widget makes. Nothing
                below hard-codes a point size.
                ==================================================================== */

            /* _tierFor, verbatim. The first tier is the only one that agrees with
                ASPECT: 20/30 is exactly 2/3. */
            function tierFor(count) {
                if (count <= 3) return { w: 20, h: 30 };
                if (count <= 6) return { w: 11, h: 22 };
                return { w: 5.4, h: 15 };
            }

            /* Today's row, jitter included. Two jitter modes:

                `aspect` is the shipped one -- width and height are perturbed
                independently, so the box aspect wanders and every cover is cropped by a
                different amount. That is why the row reads as broken rather than as
                organic.

                `size` scales both together from one hash, so the crop is at least
                uniform. It does not fix the crop; it fixes only the inconsistency, and
                seeing that it is not enough is the point of the toggle. */
            function layoutToday(books, o) {
                const t = tierFor(books.length);
                const items = books.map((b) => {
                    const h = bookHash(b.isbn);
                    if (o.sizeJitter) {
                        const s = 1 + ((h % 7) / 7) * 0.2;
                        return { b, wU: t.w * s, hU: t.h * s, kind: "face" };
                    }
                    return {
                        b,
                        wU: t.w + (h % 3),
                        hU: t.h + (Math.floor(h / 3) % 4),
                        kind: "face",
                    };
                });
                return { rows: [{ items }] };
            }

            /* Faces at ASPECT, filling a width budget, with the jitter applied as one
                scale per book so the aspect cannot drift. Height is clamped twice: by
                `hCapU` -- 30 units, today's full tier, so a two-book card does not
                become two enormous covers -- and by the well.

                This is the shared primitive behind options 2, 3, 5 and 7. */
            function fitFaces(books, opt) {
                const jitter = opt.jitter !== false;
                const scales = books.map((b) =>
                    jitter ? 1 + ((bookHash(b.isbn) % 5) / 5) * 0.18 : 1,
                );
                const sum = scales.reduce((a, c) => a + c, 0);
                let unitW = opt.budgetU / sum;
                const cap = Math.min(
                    opt.hCapU === undefined ? 30 : opt.hCapU,
                    H_BUDGET_U,
                );
                const maxH = (unitW * Math.max.apply(null, scales)) / ASPECT;
                if (maxH > cap) unitW *= cap / maxH;
                return books.map((b, i) => {
                    const wU = unitW * scales[i];
                    return { b, wU, hU: wU / ASPECT, kind: "face" };
                });
            }

            /* Option 2: honour ASPECT and keep every cover the card draws today. */
            function layoutAspect(books) {
                const n = books.length;
                return {
                    rows: [
                        {
                            items: fitFaces(books, {
                                budgetU: CARD_UNITS - GAP_U * (n - 1),
                            }),
                        },
                    ],
                };
            }

            /* Option 3: cap the row and print the remainder.

                  `CAP` is 8 because that is roughly where a cover at ASPECT stops being
                  legible, and because the hero figure already states the total -- the row
                  does not have to be the inventory.

                  There is a real case for 6 instead, and it is not about size: kCardStampMax
                  is 6, so a row capped at six is a row where the candlelight reveal always
                  prints a date on every cover instead of degrading to the warm mark. The
                  cap and the reveal would stop being two independent numbers. */
            const CAP = 8;
            const PLATE_U = 7.5;
            function layoutCap(books, o, total) {
                const n = Math.min(books.length, CAP);
                const shown = books.slice(0, n);
                const rest = total - n;
                const plate = rest > 0;
                const gaps = GAP_U * (n - 1 + (plate ? 1 : 0));
                const items = fitFaces(shown, {
                    budgetU: CARD_UNITS - gaps - (plate ? PLATE_U : 0),
                });
                const tallest = Math.max.apply(
                    null,
                    items.map((i) => i.hU),
                );
                return {
                    rows: [{ items }],
                    plate: plate
                        ? { wU: PLATE_U, hU: tallest * 0.42, rest }
                        : null,
                };
            }

            /* ---- the shelf budget, hoisted, because three things now read it ----

               `layoutTwoRows`, `boardPlan` and the capacity table have to agree about
               how tall a cover on a two-board card may be, and a second copy of this
               arithmetic is how the tiers drifted from ASPECT in the first place. */

            /* One board: today's full tier, 30 units, so a two-book card is not
               redesigned into two enormous covers. */
            const CAP1_U = Math.min(30, H_BUDGET_U);

            /* What a second board costs: another board, its air, and the 6pt between
               shelves. Plus half a unit of slack -- the shareable card's overflow test
               exists because a row with zero slack passes in CI's fixed-width test
               font and clips on a phone. */
            const SHELF_EXTRA_U = BOARD_U + BOARD_GAP_U + 6 / ROW_U;

            /* Air left above the top board.

               Bounded, and tightly. Push this past ~1.7 units and the cover width it
               leaves drops below MIN_FACE_U, at which point a two-board card is not
               legal by its own rule. **Two boards of legible covers only just fit in a
               207pt well** -- see CAP3_W_U below for what that means for a third. */
            const BOARD_SLACK_U = 1.5;
            const CAP2_U = (H_BUDGET_U - SHELF_EXTRA_U) / 2 - BOARD_SLACK_U;

            /* The floor under a face-out cover, and it is the app's own number.

               kGeneratedCoverMinWidth is where generated_cover.dart stops drawing a
               title, because at 13.5% of the width it lands under 7pt. A real jacket
               sets its own type at similar fractions, so the same width is where a
               face-out cover stops carrying its title. Below it, add a board. */
            const MIN_FACE_U = GEN_MIN_W / ROW_U;

            /* The binding band, from _Cover. Load-bearing twice over here: it is the
               absolute floor under a visible sliver, because a step narrower than this
               shows black and nothing else. */
            const BIND_U = 1.2;

            /* The floor under the visible sliver of an overlapped cover.

               Three units: the binding band plus the same again in artwork. It is also
               roughly what a real shelf shows when a row of hardbacks leans -- a 30mm
               spine on a 130mm board is 23%, and 3 of 17.5 units is 17%. Below this the
               row stops being books and becomes a comb, which is a judgement rather
               than a measurement, so the capacity table prints both this ceiling and
               the geometric one at BIND_U. */
            const MIN_STEP_U = 3;

            /* Covers hold at this width once the row starts overlapping: the widest a
               two-board card can carry, so the step absorbs the count rather than the
               covers shrinking with it. */
            const OVERLAP_W_U = CAP2_U * ASPECT;

            /* ---- the three states a book on this shelf can be drawn in ----

               One rule picks between them, and it is `_fallback()`'s rule generalised:
               **draw the richest thing the width can carry.** That function already
               does exactly this for one decision -- GeneratedCover above
               kGeneratedCoverMinWidth, a bare colour block below it -- and applying the
               same test at two more thresholds is what produces a phase-out without
               anybody typing a book count.

                 w >= MIN_FACE_U            a face: the jacket, whole
                 w >= MIN_TITLED_SPINE_U    a spine with its title running up it
                 else                       a sliver: toned, separated, untitled
            */

            /* A spine's width at the card's spine height, from BookVertical's own
               proportions rather than a new number: the read pile draws a spine 26 x 124,
               so a spine as tall as a cover on a two-board card is 26 * (h / 124) wide. */
            const SPINE_W_U = (26 / 124) * CAP2_U;

            /* The floor under a *titled* spine. The read pile sets a 12pt title on a 26pt
               spine -- 46% of the width -- and 5pt is where rotated type stops being
               readable at arm's length, so a titled spine cannot be narrower than
               5 / 0.46 points. Below this a spine still has a tone and a separator, but
               it stops claiming to say which book it is. */
            const SPINE_TITLE_RATIO = 12 / 26;
            const MIN_TITLED_SPINE_U = 5 / SPINE_TITLE_RATIO / ROW_U;

            /* The floor under an untitled sliver. Two units: the 1pt hairline the read
               pile draws between spines, plus about 5pt of tone either side of it, which
               is enough to read as "another book" rather than as a gradient. Narrower
               than MIN_STEP_U because a sliver of *spine* has no artwork to lose --
               that is the whole reason the phase-out reaches further than `boards`. */
            const MIN_SLIVER_U = 2;

            /* Most faces the front of the shelf will carry, however few books there are
               past them. Five, because a sixth face pushes the first spine off the top
               board and the front group stops reading as a group. */
            const PHASE_FACE_MAX = 5;

            /* Books per board at a given step, and the two ceilings that follow. */
            const perAtStep = (step) =>
                1 + Math.floor((CARD_UNITS - OVERLAP_W_U) / step);
            const MAX_BOOKS = 2 * perAtStep(MIN_STEP_U);
            const MAX_BOOKS_GEOMETRIC = 2 * perAtStep(BIND_U);

            /* Why the answer is two boards and not three.

               A third board leaves each row this wide, and it is well under
               MIN_FACE_U -- so a three-board card cannot carry a cover that draws its
               own title, whatever the count. The ceiling on boards is the well's
               height, not a design preference, and this is the number that says so. */
            const CAP3_W_U =
                ((H_BUDGET_U - 2 * SHELF_EXTRA_U) / 3 - BOARD_SLACK_U) * ASPECT;

            /* Which way a stack leans, and it is not a cosmetic choice.

               A cover is only whole if nothing is painted over it, so whichever end of
               the stack is on top is the end that shows a complete jacket -- and the
               other covers show the side that is *not* covered.

                 left  - newest leftmost and whole, z falling to the right. Keeps
                         `cardCoverBooks`' order and its documented reason (the leftmost
                         is the one that survives a crop), and reads left-to-right
                         newest-first. Every other cover shows its fore-edge side.
                 right - oldest leftmost, newest rightmost and whole. Every other cover
                         shows its spine side, which is the more informative sliver --
                         binding band, and where a title starts. Costs the order.

               There is no third option: showing the left of each cover requires the
               right of each cover to be covered, which is the definition of leaning
               right. The toggle exists because the trade is real. */
            function leanItems(list, wU, hU, stepU, lean) {
                const seq = lean === "right" ? list.slice().reverse() : list;
                return seq.map((b, i) => {
                    /* One scale for both dimensions. Jittering them separately is what
                       broke the shipped row, and it would break this one identically. */
                    const s = 1 - ((bookHash(b.isbn) % 5) / 5) * 0.1;
                    return {
                        b,
                        wU: wU * s,
                        hU: hU * s,
                        kind: "face",
                        xU: i * stepU,
                        z: lean === "right" ? i + 1 : seq.length - i,
                    };
                });
            }

            /* Option 4: overlap them.

                Drawn oldest-first left to right, so the newest book is on top of the
                stack and the one cover shown whole. That reverses today's order, which
                is a real cost and is called out in the notes -- but the thing being
                hidden is now *occlusion* rather than a crop, and the eye forgives one
                and not the other. */
            function layoutStack(books, o) {
                const n = books.length;
                const hU = Math.min(20, H_BUDGET_U);
                const wU = hU * ASPECT;
                const stepU = Math.min(
                    wU * 0.62,
                    n > 1 ? (CARD_UNITS - wU) / (n - 1) : 0,
                );
                return {
                    rows: [
                        {
                            items: leanItems(
                                books,
                                wU,
                                hU,
                                stepU,
                                (o && o.lean) || "right",
                            ),
                            stack: true,
                            heightU: hU,
                        },
                    ],
                    stepU,
                    baseWU: wU,
                    shown: stepU / wU,
                };
            }

            /* Option 5: a second board.

                Past six books the well grows a second shelf. Under six nothing changes,
                which is deliberate: the low tiers are already correct and the median
                reader's card should not be redesigned to fix a bug at n=12. */
            function layoutTwoRows(books) {
                const n = books.length;
                if (n <= 6) return layoutAspect(books);
                const per = Math.ceil(n / 2);
                /* One extra board, its air, the 6pt between shelves, and half a unit of
                      slack: the shareable card's overflow test exists because a row with
                      zero slack passes in CI's fixed-width test font and clips on a phone. */
                const extraU = SHELF_EXTRA_U;
                const capU = CAP2_U;
                const top = books.slice(0, per);
                const bottom = books.slice(per);
                const mk = (list) =>
                    fitFaces(list, {
                        budgetU: CARD_UNITS - GAP_U * (per - 1),
                        hCapU: capU,
                    });
                /* Both rows are sized off `per` so the two boards carry books of the
                  same size; a short bottom row is centred, not stretched. */
                const t = mk(top);
                const bItems = mk(
                    bottom.concat(top.slice(bottom.length)),
                ).slice(0, bottom.length);
                const b = bottom.map((bk, i) => ({
                    b: bk,
                    wU: bItems[i] ? bItems[i].wU : t[0].wU,
                    hU: bItems[i] ? bItems[i].hU : t[0].hU,
                    kind: "face",
                }));
                return { rows: [{ items: t }, { items: b }] };
            }
