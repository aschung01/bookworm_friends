                    reading: true,
                    chrome: true,
                    lay: (b, o) => layoutShelf(b, o),
                    body:
                        "<p><b><code>boards</code> and <code>phase</code> differ in exactly one thing that matters: whether a book you have read is drawn as a cover or as a spine.</b> " +
                        "Everything else about them was machinery for absorbing a large library, and that machinery is now gone.</p>" +
                        "<p><b>That one thing was handed to the reader as a setting, and then taken back \u2014 which is the only part of this page that has changed since it shipped.</b> The share preview carried a display panel with <i>Covers</i> and <i>Spines</i>, and briefly a <i>Layout</i> group under them offering side by side beside overlapping. All of it is gone. <b>The card draws overlapping covers and nothing else</b>, for a reason the switcher above this text makes obvious once you use it: the card exists to be recognised as the reader\u2019s own shelf, and a shelf of spines is a picture of a different object. Covers are also the asset this whole page is about \u2014 the thing a competitor cannot fake \u2014 so a setting that hides them is a setting that gives away the point.</p>" +
                        "<p>The two withdrawn modes stay drawable here because they are the evidence, and the capacity table is what they are evidence of: side by side holds " +
                        SHELF_MAX.single[0] +
                        " where overlapping holds " +
                        SHELF_MAX.overlap[0] +
                        ", and spines hold " +
                        SHELF_MAX.spine[0] +
                        " \u2014 so spines were the roomiest and still lost, which is the argument being recorded. Nothing on this page should be read as claiming a reader can pick between them.</p>" +
                        "<p><b>Nothing is squeezed.</b> Three fixed sizes, none invented: a cover is " +
                        r1(SHELF_FACE_U * ROW_U) +
                        "pt (the widest a two-board card carries), a spine is " +
                        r1(SHELF_SPINE_U * ROW_U) +
                        "pt (<code>BookVertical</code>'s own proportion at that height), and a leaning cover advances by " +
                        r1(SHELF_STEP_U * ROW_U) +
                        "pt \u2014 <b>equal to the spine width, because a leaning book shows exactly a spine's worth of itself.</b> That is the only thing the spine measurement is still used for: <code>kCardSpineUnits</code> is borrowed from <code>BookVertical</code> for the proportion, and the card draws no spines. " +
                        "Past capacity the shelf does not thin, shrink or crowd: it says how many it is not showing.</p>" +
                        "<p>Two things follow from refusing to squeeze. <b>Capacity becomes a fact</b> rather than something to be engineered \u2014 " +
                        SHELF_MAX.overlap[2] +
                        " with two books open, " +
                        SHELF_MAX.overlap[3] +
                        " with three \u2014 which is as many as the shelf ever puts at the front, the cap being whatever leaves the top board room for one finished cover \u2014 and " +
                        SHELF_MAX.overlap[0] +
                        " with none. And <b>nothing leans below 9 books</b>, because overlapping is permission to lean rather than an instruction to: the shelf only leans once a board is full. Refusing to squeeze does not mean refusing to fill, so a two-book card is still two large covers.</p>" +
                        '<div class="cost"><b>Resolved &mdash; the bookmark carries the distinction, and the figure does not move.</b> The hero keeps counting <i>finished</i> books, so a card with two open books on its shelf prints 22 over 24 covers. That is not a disagreement to hide: the two covers wearing a bookmark are visibly a different class of thing, and the count of books you have <i>read</i> is the one number on the card that has to keep meaning exactly what it says. The alternative &mdash; a figure that counts both &mdash; would make \u201c22 books\u201d mean \u201c20 finished and 2 started\u201d, which is a worse number and a claim <code>library_card_stats.dart</code> does not make. So the bookmark and the missing month stamp are load-bearing rather than decorative, and neither can be dropped later for looks.</div>' +
                        "<div class=\"cost\"><b>Resolved: there is no setting, and the machinery it needed is gone with it.</b> The panel, its stored preference (<code>card_display_provider.dart</code>), the <code>display</code> field on the export request, the <code>display</code> analytics dimension and the spine renderer in <code>card_cover_row.dart</code> have all been removed \u2014 along with the argument that had to be made for each: whether the setting travelled in the PNG, which key it lived under, and what a reader who had chosen spines saw after an update. <b>A choice is a cost even when the code is cheap</b>, and this one was being paid on the one screen whose job is to make the reader proud of what they are about to send. <b>Cost:</b> a reader who preferred spines cannot have them. <b>Buys:</b> one shelf, one renderer, one capacity number, and no preference to store, migrate or explain.</div>",
                },
            ];

            /* ---- the diagnosis table: the tiers, measured ---- */
            function tableHtml() {
                const head =
                    "<tr><th>books</th><th>box, units</th><th>aspect</th><th>jacket kept</th><th>with the jitter</th><th>worst</th></tr>";
                const rows = [
                    [3, "1–3"],
                    [6, "4–6"],
                    [12, "7–12"],
                ]
                    .map(([count, label]) => {
                        const t = tierFor(count);
                        const a = t.w / t.h;
                        const keep = a < ASPECT ? a / ASPECT : ASPECT / a;
                        /* The jitter's own range: width +0..2, height +0..3, independently. */
                        const lo = t.w / (t.h + 3),
                            hi = (t.w + 2) / t.h;
                        const worst = Math.min(
                            lo < ASPECT ? lo / ASPECT : ASPECT / lo,
                            hi < ASPECT ? hi / ASPECT : ASPECT / hi,
                            keep,
                        );
                        const cls =
                            worst > 0.95 ? "good" : worst < 0.7 ? "bad" : "";
                        return (
                            '<tr class="' +
                            cls +
                            '"><td>' +
                            label +
                            "</td><td>" +
                            t.w +
                            " × " +
                            t.h +
                            "</td><td>" +
                            r2(a) +
                            "</td><td>" +
                            pct(keep) +
                            "</td><td>" +
                            r2(lo) +
                            " – " +
                            r2(hi) +
                            "</td><td>" +
                            pct(worst) +
                            "</td></tr>"
                        );
                    })
                    .join("");
                return head + rows;
            }

            /* The phase-out's own ceiling, found by asking it rather than by solving it
               a second time: a closed form would be a third copy of the double-floor
               arithmetic and would eventually disagree with the drawings. Computed once. */
            function phaseCapacity(nReading) {
                let n = Math.max(1, nReading) + 1;
                while (
                    n < 4000 &&
                    phasePlan(nReading, n - nReading).rest === 0
                ) {
                    n++;
                }
                return n - 1;
            }
            const PHASE_MAX = [0, 1, 2].map(phaseCapacity);

            /* ---- the capacity ladder: how many books this can actually hold ----

               Every number is read off `boardPlan`, so the table cannot disagree with
               the drawings beside it. The two ceilings at the bottom are the only
               numbers not taken from a drawn count: MIN_STEP_U is a judgement about the
               smallest sliver that still reads as a book, and BIND_U is the point where
               a sliver is entirely binding band and contains no artwork at all -- the
               geometric limit, printed so the judgement can be seen against it. */
            function capacityTable() {
                const head =
                    "<tr><th>books</th><th>mode</th><th>boards</th><th>per board</th>" +
                    "<th>cover, pt</th><th>sliver, pt</th><th>each shown</th><th>drawn</th></tr>";
                const rows = [
                    1,
                    5,
                    6,
                    10,
                    11,
                    12,
                    22,
                    30,
                    40,
                    50,
                    MAX_BOOKS,
                    MAX_BOOKS + 20,
                ]
                    .map((n) => {
                        const p = boardPlan(n);
                        const sliver =
                            p.stepU === null ? null : Math.min(p.stepU, p.wU);
                        const cls =
                            p.rest > 0 ? "bad" : p.stepU === null ? "good" : "";
                        return (
                            '<tr class="' +
                            cls +
                            '"><td>' +
                            n +
                            "</td><td><code>" +
                            p.mode +
                            "</code></td><td>" +
                            p.boards +
                            "</td><td>" +
                            p.per +
                            "</td><td>" +
                            r1(p.wU * ROW_U) +
                            " × " +
                            r1(p.hU * ROW_U) +
                            "</td><td>" +
                            (sliver === null ? "—" : r1(sliver * ROW_U)) +
                            "</td><td>" +
                            (sliver === null
                                ? "whole"
                                : pct(Math.min(1, p.stepU / p.wU))) +
                            "</td><td>" +
                            p.drawn +
                            (p.rest > 0 ? " <b>+" + p.rest + "</b>" : "") +
                            "</td></tr>"
                        );
                    })
                    .join("");
                return head + rows;
            }

            /* The phase-out's ladder. Its rungs are further apart because it reaches
               further: a sliver of spine has no artwork to lose. */
            function phaseTable() {
                const head =
                    "<tr><th>books</th><th>mode</th><th>faces</th><th>spine, pt</th>" +
                    "<th>state</th><th>boards</th><th>drawn</th></tr>";
                const rows = [
                    10,
                    12,
                    22,
                    31,
                    36,
                    50,
                    70,
                    PHASE_MAX[2],
                    PHASE_MAX[2] + 30,
                ]
                    .map((n) => {
                        const p = phasePlan(2, Math.max(0, n - 2));
                        const state =
                            p.spineW === null
                                ? "all faces"
                                : p.spineW >= MIN_TITLED_SPINE_U
                                  ? "titled spines"
                                  : "slivers";
                        const cls =
                            p.rest > 0
                                ? "bad"
                                : p.spineW === null
                                  ? "good"
                                  : "";
                        return (
                            '<tr class="' +
                            cls +
                            '"><td>' +
                            n +
                            "</td><td><code>" +
                            p.mode +
                            "</code></td><td>" +
                            p.faces +
                            "</td><td>" +
                            (p.spineW === null ? "—" : r1(p.spineW * ROW_U)) +
                            "</td><td>" +
                            state +
                            "</td><td>" +
                            p.boards +
                            "</td><td>" +
                            p.drawn +
                            (p.rest > 0 ? " <b>+" + p.rest + "</b>" : "") +
                            "</td></tr>"
                        );
                    })
                    .join("");
                return head + rows;
            }

            /* Capacity with nothing squeezed: one number per setting, and the sizes that
               produce it. This is the table the decision rests on. */
            function shelfTable() {
                const head =
                    "<tr><th>read books as</th><th>drawn width, pt</th><th>advance, pt</th>" +
                    "<th>per board</th><th>holds, 0 open</th><th>holds, 2 open</th>" +
                    "<th>holds, 3 open</th></tr>";
                const rows = SHELF_MODES.map(([m, label]) => {
                    const p = shelfPlan(0, 200, m);
                    const perBoard = fitCount(CARD_UNITS, p.readW, p.readStep);
                    return (
                        '<tr class="' +
                        (m === S.readAs ? "good" : "") +
                        '"><td>' +
                        label +
                        "</td><td>" +
                        r1(p.readW * ROW_U) +
                        "</td><td>" +
                        r1(p.readStep * ROW_U) +
                        "</td><td>" +
                        perBoard +
                        "</td><td>" +
                        SHELF_MAX[m][0] +
                        "</td><td>" +
                        SHELF_MAX[m][2] +
                        "</td><td>" +
                        SHELF_MAX[m][3] +
                        "</td></tr>"
                    );
                }).join("");
                return head + rows;
            }

            /* ---- state and render ---- */
            const COUNTS = [2, 5, 10, 12, 22, 40, MAX_BOOKS];
            const CAP_LADDER = [12, 22, 30, 40, MAX_BOOKS, MAX_BOOKS + 20];
            const S = {
                n: 22,
                lit: false,
                view: "opts",
                diag: false,
                sizeJitter: false,
                lean: "left",
                reading: 2,
                readAs: "overlap",
                coverLayout: "overlap",
            };

            function optState(opt) {
                const lit = S.lit;
                const drawn = opt.take(S.n);
                return Object.assign(
                    {
                        lit,
                        diag: S.diag,
                        sizeJitter: S.sizeJitter,
                        lean: S.lean,
                        readAs: S.readAs,
                        stamped: lit && drawn <= STAMP_MAX,
                        marked: lit && drawn > STAMP_MAX,
                    },
                    opt.o || {},
                );
            }

            function buildOne(opt) {
                const o = optState(opt);
                /* Only the phase-out asks for the open books; every other option draws
                   from the finished corpus alone, which is what the card shows today. */
                const reading = opt.reading ? readingFor(S.reading) : [];
                const books = reading.concat(booksFor(opt.take(S.n)));

                /* Two different totals, and keeping them apart is the whole of the open
                   question. `total` is what the layout has to account for, open books
                   included. The card's figure stays at the *finished* count, because that
                   is what `library_card_stats.dart` counts -- so a card with open books on
                   its shelf visibly carries more covers than its own number, which is the
                   disagreement rather than a bug in the drawing. */
                const total = reading.length + S.n;
                const lay = opt.lay(books, o, total);
                return {
                    o,
                    lay,
                    html: stageHtml(lay, o, S.n),
                    zoom: cropCallout(lay, o),
                    total,
                };
            }

            function render() {
                document.getElementById("h1").innerHTML =
                    "The cover row crops every jacket except at one book count, and the jitter crops that one too";
                document.getElementById("lead").innerHTML =
                    "<b>Root cause:</b> <code>_tierFor</code> in <code>card_cover_row.dart</code> hands out boxes whose aspect ratio does not match a book cover's, and <code>_face()</code> fills them with " +
                    "<code>BoxFit.cover</code>, which centre-crops. At twelve books each box is " +
                    r1(5.4 * ROW_U) +
                    "pt wide and " +
                    r1(15 * ROW_U) +
                    "pt tall in the 360×450 export — an aspect of 0.36 where <code>kDefaultCoverAspect</code> is 0.67 — so a jacket is scaled to " +
                    r1(15 * ROW_U * ASPECT) +
                    "pt wide and then " +
                    r1(15 * ROW_U * ASPECT - 5.4 * ROW_U) +
                    "pt of it is thrown away, half off each side. " +
                    "Everything below is drawn at 1px = 1pt, so these are the export's own numbers.";
                document.getElementById("tbl").innerHTML = tableHtml();
                document.getElementById("tblnote").innerHTML =
                    "The first tier is the only one that agrees with the app's own cover aspect — 20/30 is exactly 2/3 — which is good evidence the other two drifted rather than being chosen. " +
                    "The last two columns are the jitter: because width and height are perturbed <i>independently</i> (<code>+ hash % 3</code> and <code>+ hash ~/ 3 % 4</code>), it moves the aspect as well as the size, and so it crops a further 9% even at the tier that is nominally exact.";

                const opts = document.getElementById("opts");
                const grid = document.getElementById("gridv");
                const showGrid = S.view === "grid";
                opts.classList.toggle("gone", showGrid);
                grid.classList.toggle("gone", !showGrid);
                document.getElementById("opts-h").textContent = showGrid
                    ? "All options at " + S.n + " books"
                    : "The options";

                if (showGrid) {
                    grid.innerHTML = OPTS.map((opt, i) => {
                        const b = buildOne(opt);
                        return (
                            '<div class="gcell"><div class="gh2"><span class="n">' +
                            i +
                            '</span><span class="t">' +
                            opt.t +
                            "</span></div>" +
                            '<div class="gzoom">' +
                            b.html +
                            "</div>" +
                            metricsOf(b.lay, b.o, b.total) +
                            "</div>"
                        );
                    }).join("");
                    renderCapacity();
                    return;
                }

                opts.innerHTML = OPTS.map((opt, i) => {
                    const b = buildOne(opt);
                    const badge = opt.badge
                        ? '<span class="badge ' +
                          (opt.badge[0] || "") +
                          '">' +
                          opt.badge[1] +
                          "</span>"
                        : "";
                    return (
                        '<div class="opt" id="o-' +
                        opt.id +
                        '"><div class="oh"><span class="n">' +
                        i +
                        '</span><span class="t">' +
                        opt.t +
                        "</span>" +
                        badge +
                        "<code>" +
                        opt.id +
                        "</code></div>" +
                        "<div>" +
                        (opt.chrome
                            ? '<div class="stagewrap">' +
                              b.html +
                              displayMenu() +
                              '</div><div class="chromenote">The panel is preview chrome and is not in the exported PNG &mdash; but the choice it makes is, because the payload is an image. See the notes.</div>'
                            : b.html) +
                        metricsOf(b.lay, b.o, b.total) +
                        b.zoom +
                        "</div>" +
                        '<div class="body">' +
                        opt.body +
                        "</div></div>"
                    );
                }).join("");
                renderCapacity();
            }

            /* ---- the capacity section ----

               Drawn with the hybrid only, because it is the only option whose answer to
               "how many" is a number rather than a cap: `now`, `aspect` and `spines`
               stop at kCardCoverMax, `cap` stops at 8, and `rows` keeps shrinking the
               covers until they are slivers with gaps between them. */
            function renderCapacity() {
                /* ---- the decided answer: fixed sizes, a count for the remainder ---- */
                document.getElementById("shelf-lead").innerHTML =
                    "<b>One number per setting, and none of them is negotiable.</b> Nothing thins, nothing shrinks, nothing crowds \u2014 so capacity stops being something to engineer and becomes a fact to state. " +
                    "The three sizes are the only inputs: a cover at " +
                    r1(SHELF_FACE_U * ROW_U) +
                    "pt, a spine at " +
                    r1(SHELF_SPINE_U * ROW_U) +
                    "pt, and a leaning cover advancing by a spine's width. " +
                    "Beyond the number, the shelf prints how many it is not showing.";
                document.getElementById("shelf-tbl").innerHTML = shelfTable();
                document.getElementById("shelf-note").innerHTML =
                    "<b>An open book costs a slot, never the size of anything else.</b> Side by side it costs exactly one \u2014 which is all a read cover would have cost \u2014 so both open-book columns are unchanged at " +
                    SHELF_MAX.single[0] +
                    "; overlapping and spines lose " +
                    (SHELF_MAX.overlap[0] - SHELF_MAX.overlap[2]) +
                    " and " +
                    (SHELF_MAX.spine[0] - SHELF_MAX.spine[2]) +
                    " books at two open, " +
                    (SHELF_MAX.overlap[0] - SHELF_MAX.overlap[3]) +
                    " and " +
                    (SHELF_MAX.spine[0] - SHELF_MAX.spine[3]) +
                    " at three, because a whole cover displaces several leaning ones or several spines. <b>The last column is the worst case, and it is the one to read:</b> three is the cap, so no reader can push the shelf past it however many books they have on the go. That is the honest price of putting the open books on the card, and it is paid in capacity rather than in squeezed read books.</p><p>" +
                    "<b>Against the real distribution:</b> the median reader has finished two books and the card in the report shows 22 \u2014 so <i>spines</i> and <i>overlapping covers</i> both clear the realistic range while <i>side by side</i> does not, which makes the default worth arguing about. " +
                    "The whole migrated corpus holds 293 finished books across every user, so the remainder count is load-bearing at the tail whatever the setting.";

                const so = optState({ take: () => 12, o: {} });
                document.getElementById("shelf-grid").innerHTML =
                    SHELF_MODES.map(([m, label]) => {
                        const o = Object.assign({}, so, {
                            readAs: m,
                            diag: false,
                        });
                        const books = readingFor(S.reading).concat(
                            booksFor(S.n),
                        );
                        const lay = layoutShelf(books, o);
                        return (
                            '<div class="gcell"><div class="gh2"><span class="n">' +
                            (m === S.readAs ? "●" : "○") +
                            '</span><span class="t">' +
                            label +
                            "</span></div>" +
                            '<div class="gzoom">' +
                            stageHtml(lay, o, S.n) +
                            "</div>" +
                            metricsOf(lay, o, S.reading + S.n) +
                            "</div>"
                        );
                    }).join("");

                /* The two sections below document the approach that was rejected: both
                   absorb a large library by making things smaller. Kept browsable rather
                   than deleted, because the numbers they establish -- what squeezing would
                   have bought, and what it would have cost -- are the reason the shelf
                   above refuses to do it. */
                document.getElementById("cap-h").textContent =
                    "Parked: what squeezing the covers would have bought";
                document.getElementById("cap-lead").innerHTML =
                    "<b>" +
                    MAX_BOOKS +
                    " books, and the binding constraint is not the width \u2014 it is how thin a sliver still reads as a book.</b> " +
                    "Once the row is overlapping, a cover holds at " +
                    r1(OVERLAP_W_U * ROW_U) +
                    "pt and only the step shrinks, so capacity is <code>2 \u00d7 (1 + (106 \u2212 " +
                    r1(OVERLAP_W_U) +
                    ") / step)</code>. At the " +
                    r1(MIN_STEP_U * ROW_U) +
                    "pt floor drawn here \u2014 the binding band plus the same again in artwork \u2014 that is <b>" +
                    perAtStep(MIN_STEP_U) +
                    " per board, " +
                    MAX_BOOKS +
                    " in total</b>. " +
                    "The geometric limit is <b>" +
                    MAX_BOOKS_GEOMETRIC +
                    "</b>, where the step equals the " +
                    r1(BIND_U * ROW_U) +
                    "pt binding band and every sliver is black with no artwork in it at all. " +
                    "Somewhere between the two the row stops being books and becomes a comb; the ladder below is there to let you put the line where you want it.";
                document.getElementById("cap-tbl").innerHTML = capacityTable();
                document.getElementById("cap-note").innerHTML =
                    "<b>Why two boards and not three.</b> A third board leaves each row " +
                    r1(CAP3_W_U * ROW_U) +
                    "pt of cover width, against the " +
                    r1(GEN_MIN_W) +
                    "pt floor \u2014 so a three-board card cannot carry a cover that draws its own title, at any count. " +
                    "Two boards is not a preference, it is the last layout the well's height permits: at " +
                    r1(BOARD_SLACK_U) +
                    " units of air above the top board the covers are " +
                    r1(OVERLAP_W_U * ROW_U) +
                    "pt wide, only " +
                    r1((OVERLAP_W_U - MIN_FACE_U) * ROW_U) +
                    "pt clear of the floor.</p><p>" +
                    "<b>Against the real distribution:</b> the median reader has finished <b>two</b> books, the card in the report shows <b>22</b>, and the whole migrated corpus holds <b>293</b> finished books across every user. " +
                    "So " +
                    MAX_BOOKS +
                    " covers all but the extreme tail \u2014 and it does not cover the tail, which is the finding: <b>no geometry does.</b> " +
                    "A library of 293 needs a plate whatever the layout, so the overflow indicator from <code>cap</code> is not an alternative to this option, it is a component of it. " +
                    "The rows below that drop books are marked in red.";

                const o = Object.assign(optState({ take: () => 12, o: {} }), {
                    diag: false,
                });
                document.getElementById("cap-grid").innerHTML = CAP_LADDER.map(
                    (n) => {
                        const lay = layoutBoards(booksFor(n), o);
                        const p = lay.plan;
                        return (
                            '<div class="gcell"><div class="gh2"><span class="n">' +
                            n +
                            '</span><span class="t">' +
                            (p.rest > 0
                                ? p.drawn +
                                  " drawn, " +
                                  p.rest +
                                  " on the plate"
                                : p.per + " per board") +
                            "</span></div>" +
                            '<div class="gzoom">' +
                            stageHtml(lay, o, n) +
                            "</div>" +
                            metricsOf(lay, o, n) +
                            "</div>"
                        );
                    },
                ).join("");

                /* ---- and the phase-out's ---- */
                document.getElementById("cap2-h").textContent =
                    "Parked: what thinning the spines would have bought";
                document.getElementById("cap2-lead").innerHTML =
                    "<b>" +
                    PHASE_MAX[2] +
                    " books with two open, against " +
                    MAX_BOOKS +
                    " for <code>boards</code> \u2014 and the reason is that it gives up something different.</b> " +
                    "<code>boards</code> keeps every book a face and pays for the count in occlusion, so its floor is the " +
                    r1(MIN_STEP_U * ROW_U) +
                    "pt sliver of <i>jacket</i> that still reads as a book. The phase-out gives up the jacket first, and a sliver of <i>spine</i> has no artwork to lose \u2014 so its floor is " +
                    r1(MIN_SLIVER_U * ROW_U) +
                    "pt, the read pile's hairline plus tone either side of it.";
                document.getElementById("cap2-tbl").innerHTML = phaseTable();
                document.getElementById("cap2-note").innerHTML =
                    "Read the <code>faces</code> column downward: <b>" +
                    PHASE_FACE_MAX +
                    " \u2192 4 \u2192 3 \u2192 2, and then it stops</b>, because two is what the reader has open. " +
                    "Only after that do the spines start to thin, and only after <i>that</i> do they stop carrying titles. " +
                    "Nothing is dropped until " +
                    PHASE_MAX[2] +
                    ". With one book open the ceiling is " +
                    PHASE_MAX[1] +
                    ", and with none it is " +
                    PHASE_MAX[0] +
                    " \u2014 the front group is the only thing the count is spent on.";

                const po = Object.assign({}, o, { lit: S.lit });
                document.getElementById("cap2-grid").innerHTML = [
                    22,
                    50,
                    PHASE_MAX[2],
                    PHASE_MAX[2] + 30,
                ]
                    .map((n) => {
                        const books = readingFor(2).concat(booksFor(n - 2));
                        const lay = layoutPhase(books, po, n);
                        const p = lay.phase;
                        return (
                            '<div class="gcell"><div class="gh2"><span class="n">' +
                            n +
                            '</span><span class="t">' +
                            p.faces +
                            " face" +
                            (p.faces > 1 ? "s" : "") +
                            (p.spineW
                                ? ", " +
                                  r1(p.spineW * ROW_U) +
                                  "pt " +
                                  (p.spineW >= MIN_TITLED_SPINE_U
                                      ? "spines"
                                      : "slivers")
                                : "") +
                            (p.rest ? ", " + p.rest + " on the plate" : "") +
                            "</span></div>" +
                            '<div class="gzoom">' +
                            stageHtml(lay, po, n - 2) +
                            "</div>" +
                            metricsOf(lay, po, n) +
                            "</div>"
                        );
                    })
                    .join("");
            }

            /* ---- controls ---- */
            function seg(el, values, get, set) {
                el.innerHTML = values
                    .map(
                        (v) =>
                            '<button data-v="' +
                            v[0] +
                            '" class="' +
                            (get() === v[0] ? "on" : "") +
                            '">' +
                            v[1] +
                            "</button>",
                    )
                    .join("");
                el.querySelectorAll("button").forEach((btn) =>
                    btn.addEventListener("click", () => {
                        const raw = btn.dataset.v;
                        set(isNaN(Number(raw)) ? raw : Number(raw));
                        paint();
                    }),
                );
            }

            function paint() {
                seg(
                    document.getElementById("seg-n"),
                    COUNTS.map((c) => [c, String(c)]),
                    () => S.n,
                    (v) => (S.n = v),
                );
                seg(
                    document.getElementById("seg-light"),
                    [
                        ["day", "Daylight"],
                        ["cdl", "Candlelight"],
                    ],
                    () => (S.lit ? "cdl" : "day"),
                    (v) => (S.lit = v === "cdl"),
                );
                seg(
                    document.getElementById("seg-view"),
                    [
                        ["opts", "Detail"],
                        ["grid", "All at once"],
                    ],
                    () => S.view,
                    (v) => (S.view = v),
                );
                seg(
                    document.getElementById("seg-lean"),
                    [
                        ["left", "Newest whole"],
                        ["right", "Spines shown"],
                    ],
                    () => S.lean,
                    (v) => (S.lean = v),
                );
                /* Nought to three, three being the front group's cap. It stopped at two,
                   and that is half of why a front group that ate the whole top board was
                   never once on screen: the drawing could not be asked for it. */
                seg(
                    document.getElementById("seg-reading"),
                    [
                        [0, "0"],
                        [1, "1"],
                        [2, "2"],
                        [3, "3"],
                    ],
                    () => S.reading,
                    (v) => (S.reading = v),
                );
                document.getElementById("cb-diag").checked = S.diag;
                document.getElementById("cb-jit").checked = S.sizeJitter;
                document
                    .getElementById("lab-diag")
                    .classList.toggle("on", S.diag);
                document
                    .getElementById("lab-jit")
                    .classList.toggle("on", S.sizeJitter);
                render();
            }

            /* The display panel's buttons survive a re-render because the listener is on
               the document, not on them: `render()` replaces the whole options list, which
               would strip anything bound directly to a button inside it. */
            document.addEventListener("click", (e) => {
                const t =
                    e.target && e.target.closest
                        ? e.target.closest("[data-disp]")
                        : null;
                if (!t) return;
                const parts = t.dataset.disp.split(":");
                let v = parts[1];
                /* `Covers` returns to the layout last chosen rather than resetting it. */
                if (v === "@cover") v = S.coverLayout || "overlap";
                S[parts[0]] = v;
                if (parts[0] === "readAs" && v !== "spine") S.coverLayout = v;
                paint();
            });

            document
                .getElementById("cb-diag")
                .addEventListener("change", (e) => {
                    S.diag = e.target.checked;
                    paint();
                });
            document
                .getElementById("cb-jit")
                .addEventListener("change", (e) => {
                    S.sizeJitter = e.target.checked;
                    paint();
                });

            document.getElementById("foot").innerHTML =
                "<p><b>What this page cannot tell you.</b> It draws invented jackets, not the reader's. A real corpus is more uniform than this one — more dark spines, more small type — so the <i>character</i> of each option will differ from what is drawn here even though the geometry will not. " +
                "And it draws in a browser: <code>BoxFit</code> and CSS agree on the arithmetic, but Flutter's <code>ClipRRect</code>, shadow and <code>ColorFiltered</code> are not these. The numbers are trustworthy; the texture is indicative.</p>" +
                "<p><b>Not drawn, and it applies to every option:</b> real covers are not all 2/3. Google Books thumbnails run about 0.60 to 0.75, so a row could take each box's aspect from the decoded image and get its raggedness from the data instead of from a hash. The export already resolves every image before capture (<code>cardCoverProviders</code>), so the dimensions are available — it costs a resolve-then-layout pass and a fallback for the first frame.</p>" +
                "<p>Verify with <code>node docs/mockups/card-cover-crop/verify.js</code>. " +
                "Geometry ported from <code>lib/ui/widgets/library_card/card_cover_row.dart</code>, <code>shareable_library_card.dart</code> and <code>book_geometry.dart</code>; " +
                "<code>spineTintFor</code> from <code>book_chassis.dart</code> via <code>docs/mockups/read-pile-turn</code>.</p>";

            paint();
        </script>
    </body>
</html>
