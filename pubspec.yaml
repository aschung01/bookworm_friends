name: bookworm_friends
description: A social reading tracker app.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.0
  flutter_easyloading: ^3.0.5
  phosphor_flutter: ^2.1.0
  flutter_shake_animated: ^0.0.5
  emojis: ^0.9.9
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  app_links: ^6.3.0
  in_app_review: ^2.0.9
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.0
  app_tracking_transparency: ^2.0.6
  go_router: ^14.6.0
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/bookwormIcon.svg
    - assets/icons/smileBookwormIcon.svg
    - assets/icons/appleWhiteIcon.svg
    - assets/icons/appleBlackIcon.svg
    - assets/icons/googleIcon.svg
    - assets/icons/bookmarkIcon.svg
    - assets/icons/sadCharacter.svg
  fonts:
    - family: DesignHouse
      fonts:
        - asset: assets/fonts/designhouseOTFBold.otf
          weight: 700
        - asset: assets/fonts/designhouseOTFLight.otf
          weight: 300
