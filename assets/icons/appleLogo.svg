<!--
  The Apple logo, for Sign in with Apple buttons and for the provider row in
  Settings.

  This is Apple's own path data, lifted verbatim from their "Logo Square"
  artwork (Sketch 61 export) that used to ship here as appleBlackIcon.svg and
  appleWhiteIcon.svg. What changed is that those files were Apple's *logo-only
  button* artwork: each carried an opaque 44x44 plate behind the glyph -- white
  behind a black apple, or black behind a white one. Drawn inside our black
  "Continue with Apple" button, the white-plated one rendered as a pale square
  with a nearly invisible apple in it, and in Settings the same file put a white
  square on the dark theme's surface. Apple's guidelines say directly: "Use the
  logo file to position the Apple logo in a button; never use the Apple logo as
  a button."

  So the plate is gone and the viewBox is cropped tight to the glyph, which
  makes the file a *logo* rather than a button face. Two consequences worth
  knowing:

  * It is a single path with no colour of its own worth keeping -- the fill here
    is white only so the file is legible on its own. Every call site tints it
    through `ColorFilter.mode(..., BlendMode.srcIn)`, which is safe precisely
    because there is no longer a plate for the tint to flood. Tinting either of
    the old files painted the whole 44x44 square.
  * Because the box is tight, the caller sizes the *glyph*, not a padded canvas.
    Apple state the proportion indirectly -- their artwork puts a 19-unit glyph
    inside a 44-unit button face -- so a caller wanting to match Apple must ask
    for 43.2% of the button's height. `kSignInLogoRatio` in auth_page.dart is
    that number, and `sign_in_button_test.dart` pins it.

  Do not re-add padding to this file. The padding in Apple's original exists so
  that "match the height of the logo file to the height of the button" produces
  the right glyph size; expressing the same thing as an explicit ratio at the
  call site is equivalent on screen and survives a caller that sizes by width.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="15" height="19" viewBox="20.5 16 15 19">
